name: X投稿

on:
  schedule:
    - cron: '0 10 * * *'   # 19:00 JST  release(作品紹介)
    - cron: '0 12 * * *'   # 21:00 JST  devlog(開発の話)
    - cron: '0 14 * * *'   # 23:00 JST  wrapup(ひとこと反省)
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿枠'
        required: true
        default: release
        type: choice
        options:
          - release
          - devlog
          - wrapup

permissions:
  contents: write

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    name: 投稿する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: ライブラリを入れる
        run: pip install -r scripts/requirements.txt

      - name: 投稿枠を決める
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 10 * * *") slot=release ;;
            "0 12 * * *") slot=devlog ;;
            "0 14 * * *") slot=wrapup ;;
            *)            slot="${{ inputs.slot }}" ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "今回の投稿枠: $slot"

      - name: 投稿する
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GAME_BASE_URL: ${{ vars.GAME_BASE_URL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python scripts/post_to_x.py --slot "${{ steps.slot.outputs.slot }}"

      - name: 記録をコミットする
        run: |
          if [ -z "$(git status --porcelain data/posts.json)" ]; then
            echo "記録に変更がないので、コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git commit -m "chore: 投稿を記録(${{ steps.slot.outputs.slot }})"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push に失敗したので少し待って再試行します($i回目)"
            sleep 10
          done
          echo "::error::記録の push に失敗しました。"
          exit 1
