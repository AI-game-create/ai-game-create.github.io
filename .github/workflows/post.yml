name: X投稿

on:
  schedule:
    # 20:30 JST。作品紹介を投稿し、ゲームのURLを自己リプライで付ける(1日1本)
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    name: 投稿する
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: ライブラリを入れる
        run: pip install -r scripts/requirements.txt

      - name: 作品を投稿する
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GAME_BASE_URL: ${{ vars.GAME_BASE_URL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python scripts/post_to_x.py --slot release

      - name: 記録をコミットする
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/posts.json)" ]; then
            echo "記録に変更がないので、コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git commit -m "chore: 投稿を記録"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push に失敗したので少し待って再試行します($i回目)"
            sleep 10
          done
          echo "::error::記録の push に失敗しました。"
          exit 1
