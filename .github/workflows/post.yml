name: X投稿

on:
  schedule:
    # 20:30 JST。作品紹介を投稿し、ゲームのURLを自己リプライで付ける(1日1本)
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '試運転にする(投稿しない。動画の変換までは行う)'
        type: boolean
        default: false
      date:
        description: '投稿日(YYYY-MM-DD。空なら今日)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    name: 投稿する
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: ライブラリを入れる
        run: pip install -r scripts/requirements.txt

      # プレイ動画(webm)を X 用の mp4 に変換するのに使う。入らなくても画像で投稿できる
      - name: ffmpeg を入れる
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          fi
          ffmpeg -version | head -1

      - name: 作品を投稿する
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GAME_BASE_URL: ${{ vars.GAME_BASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || vars.DRY_RUN }}
          POST_DATE: ${{ inputs.date }}
        run: python scripts/post_to_x.py --slot release ${POST_DATE:+--date "$POST_DATE"}

      - name: 記録をコミットする
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/posts.json games/)" ]; then
            echo "記録に変更がないので、コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json games/
          git commit -m "chore: 投稿を記録"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push に失敗したので少し待って再試行します($i回目)"
            sleep 10
          done
          echo "::error::記録の push に失敗しました。"
          exit 1
