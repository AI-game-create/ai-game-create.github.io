name: X投稿

on:
  # GitHub の定時実行は混雑すると大きく遅れたり、来なかったりする(10/3 は 20:30 の回が 23:46 に動いた)。
  # そのため予備の時刻も置く。post_to_x.py は同じ日の同じ枠が投稿済みなら何もしないので、二重には投稿されない
  schedule:
    # 20:30 JST。作品紹介をゲームのURL付きで投稿する(1日1本)。予備 20:50 / 21:20 / 22:00
    - cron: '30 11 * * *'
    - cron: '50 11 * * *'
    - cron: '20 12 * * *'
    - cron: '0 13 * * *'
    # 月曜12:30 JST。土曜の大作の題を決める投票(キューに poll がある日だけ)。予備 13:00
    - cron: '30 3 * * 1'
    - cron: '0 4 * * 1'
    # 日曜21:30 JST。その週の作品をつないだまとめ動画。予備 22:05 / 22:35
    - cron: '30 12 * * 0'
    - cron: '5 13 * * 0'
    - cron: '35 13 * * 0'
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿の枠'
        type: choice
        options: [release, poll, weekly]
        default: release
      dry_run:
        description: '試運転にする(投稿しない。動画の変換までは行う)'
        type: boolean
        default: false
      date:
        description: '投稿日(YYYY-MM-DD。空なら今日)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    name: 投稿する
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 投稿の枠を決める
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          case "$SCHEDULE" in
            '30 3 * * 1'|'0 4 * * 1') slot=poll ;;
            '30 12 * * 0'|'5 13 * * 0'|'35 13 * * 0') slot=weekly ;;
            '') slot="${INPUT_SLOT:-release}" ;;
            *) slot=release ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "投稿の枠: $slot"

      - name: ライブラリを入れる
        run: pip install -r scripts/requirements.txt

      # プレイ動画(webm)を X 用の mp4 に変換するのに使う。入らなくても画像で投稿できる
      - name: ffmpeg を入れる
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          fi
          ffmpeg -version | head -1

      # まとめ動画の字幕(作品名)に使う日本語フォント。入らなければ字幕なしで作る
      - name: 日本語フォントを入れる
        if: steps.slot.outputs.slot == 'weekly'
        continue-on-error: true
        run: sudo apt-get install -y -q fonts-noto-cjk || (sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk)

      - name: 作品を投稿する
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GAME_BASE_URL: ${{ vars.GAME_BASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || vars.DRY_RUN }}
          POST_DATE: ${{ inputs.date }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: python scripts/post_to_x.py --slot "$SLOT" ${POST_DATE:+--date "$POST_DATE"}

      - name: 記録をコミットする
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/posts.json games/)" ]; then
            echo "記録に変更がないので、コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json games/
          git commit -m "chore: 投稿を記録"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push に失敗したので少し待って再試行します($i回目)"
            sleep 10
          done
          echo "::error::記録の push に失敗しました。"
          exit 1
