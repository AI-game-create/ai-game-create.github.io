name: 反応をあつめる

on:
  schedule:
    - cron: '0 0 * * *'   # 09:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-metrics
  cancel-in-progress: false

jobs:
  metrics:
    name: 反応を記録する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: ライブラリを入れる
        run: pip install -r scripts/requirements.txt

      - name: 反応をあつめる
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/fetch_metrics.py

      - name: 記録をコミットする
        run: |
          if [ -z "$(git status --porcelain data/posts.json)" ]; then
            echo "記録に変更がないので、コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git commit -m "chore: 投稿の反応を更新"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push に失敗したので少し待って再試行します($i回目)"
            sleep 10
          done
          echo "::error::記録の push に失敗しました。"
          exit 1
