<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ビル爆破解体</title>
<style>
:root{--hz:#ffc61a;--red:#e8322b;--d0:#ff3b2f;--d1:#ff9a1f;--d2:#ffe14a;--bp:#0b1828;--cy:#6fd8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#f2efe8;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-family:"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;font-stretch:condensed;letter-spacing:.02em}
.stripe{height:7px;background:repeating-linear-gradient(-45deg,var(--hz) 0 9px,#111 9px 18px)}
.card{background:rgba(10,11,13,.84);border:1px solid rgba(255,198,26,.32);border-radius:6px;box-shadow:0 6px 26px rgba(0,0,0,.45);overflow:hidden;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lab{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:700;padding:3px 8px 3px 7px;border-radius:3px;background:rgba(10,10,12,.78);border-left:4px solid #888;line-height:1.3}
.lab.no{border-color:#ff5a4f}.lab.zone{border-color:#ffb02e}.lab.ok{border-color:#5fe08a}
.lab small{display:block;font-weight:400;opacity:.75;font-size:10px}
#job{position:fixed;z-index:5;left:12px;top:12px;min-width:230px;max-width:min(360px,calc(100vw - 84px));display:none}
#job.on{display:block}
.jin{padding:7px 12px 9px}
.jt{display:flex;align-items:baseline;gap:8px}
#j-no{font-size:12px;color:var(--hz);font-weight:800;letter-spacing:.08em}
#j-name{font-size:16px}
#j-spec,#j-cond{font-size:12px;opacity:.85;margin-top:2px}
#j-money{margin-top:4px;font-size:13px}
#j-money b{font-size:17px;color:#fff}
#b-snd{position:fixed;z-index:6;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:rgba(10,11,13,.75);border:1px solid rgba(255,198,26,.35);font-size:18px}
#panel{position:fixed;z-index:5;right:12px;top:66px;bottom:12px;width:min(370px,42vw);display:none;flex-direction:column}
#panel.on{display:flex}
#tabs{display:flex;gap:6px;padding:8px 10px 0}
.lv{flex:1;min-height:44px;border-radius:4px;background:#1b1e22;border:1px solid #333;font-weight:800;font-size:15px;position:relative;line-height:1.1}
.lv small{display:block;font-size:10px;font-weight:400;opacity:.75}
.lv.on{background:#203247;border-color:var(--cy);color:#fff;box-shadow:inset 0 -3px 0 var(--cy)}
.lv i{position:absolute;right:4px;top:4px;font-style:normal;font-size:10px;background:var(--d0);color:#fff;border-radius:8px;padding:0 5px;display:none}
.lv i.on{display:block}
#planbox{position:relative;flex:1;min-height:110px;margin:8px 10px 6px;border-radius:5px;overflow:hidden;background:var(--bp);border:1px solid #23415f}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#pl-hint{position:absolute;left:6px;right:6px;bottom:5px;font-size:12px;color:#a9cdee;text-align:center;pointer-events:none;text-shadow:0 1px 2px #000}
#brushes{display:flex;gap:6px;padding:0 10px}
.br{flex:1;min-height:46px;border-radius:4px;background:#1b1e22;border:1px solid #333;font-weight:800;font-size:14px;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:6px}
.br i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
.br small{font-size:10px;font-weight:400;opacity:.8;display:block}
.br.on{border-color:#fff;background:#2a2d31;box-shadow:inset 0 0 0 1px #fff}
.br[data-d="0"] i{background:var(--d0);color:var(--d0)}.br[data-d="1"] i{background:var(--d1);color:var(--d1)}.br[data-d="2"] i{background:var(--d2);color:var(--d2)}
#pfoot{display:flex;gap:8px;padding:8px 10px 10px;align-items:stretch}
#b-clear{flex:0 0 74px;min-height:52px;border-radius:4px;background:#1b1e22;border:1px solid #444;font-size:12px}
#b-fire{flex:1;min-height:56px;border-radius:30px;background:radial-gradient(circle at 50% 35%,#ff6a4d,#c81f17 60%,#7c0e0a);border:3px solid #ffc61a;box-shadow:0 0 0 3px #111,0 4px 16px rgba(255,60,30,.45);font-weight:900;font-size:22px;letter-spacing:.2em;line-height:1}
#b-fire small{display:block;font-size:11px;letter-spacing:0;font-weight:600;margin-top:3px;opacity:.9}
#b-fire.dim{filter:grayscale(.7) brightness(.7)}
#b-fire small.over{color:#ffe14a}
#count{position:fixed;z-index:7;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;font-size:min(34vw,200px);font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,80,40,.8),0 6px 0 #000}
#count.on{display:flex}
#count.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:.2;transform:scale(.92)}}
#toast{position:fixed;z-index:8;left:50%;top:22%;transform:translateX(-50%);padding:8px 16px;border-radius:4px;background:rgba(0,0,0,.8);border:1px solid var(--hz);font-size:14px;display:none;white-space:nowrap}
#toast.on{display:block}
#b-fast{position:fixed;z-index:6;right:12px;bottom:14px;min-width:110px;min-height:44px;border-radius:22px;background:rgba(10,11,13,.7);border:1px solid #555;font-size:13px;display:none}
#b-fast.on{display:block}#b-fast.act{border-color:var(--hz);color:var(--hz)}
#result{position:fixed;z-index:8;left:50%;bottom:16px;transform:translateX(-50%);width:min(450px,calc(100vw - 20px));display:none}
#result.on{display:block;animation:rin .35s ease-out}
@keyframes rin{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.rin{padding:12px 16px 14px;position:relative;background:linear-gradient(#efe9db,#e2dac8);color:#222}
#r-title{font-size:12px;color:#555;letter-spacing:.06em}
.stamp{display:inline-block;margin:8px 0 4px 2px;border:5px solid currentColor;border-radius:9px;padding:2px 14px 4px;font-weight:900;font-size:clamp(28px,8vw,40px);transform:rotate(-6deg);color:#d42a1e;letter-spacing:.06em;opacity:.92;mix-blend-mode:multiply}
.stamp.bad{color:#3a2a56}
.stamp.go{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.4);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:.92}}
#r-stars{position:absolute;right:16px;top:30px;font-size:26px;color:#c79a10;letter-spacing:2px}
#r-lines{font-size:13px;line-height:1.65;margin-top:4px;border-top:1px dashed #aaa;padding-top:6px}
#r-lines .r{display:flex;justify-content:space-between;gap:10px}
#r-lines .m{color:#b2231a}#r-lines .p{color:#16703a}
#r-lines .tot{font-weight:800;border-top:1px solid #999;margin-top:3px;padding-top:3px}
#r-hint{margin-top:8px;font-size:13px;background:#fff6c9;border-left:4px solid var(--hz);padding:6px 9px}
.rbtn{display:flex;gap:8px;margin-top:10px}
.rbtn button{flex:1;min-height:48px;border-radius:4px;font-weight:800;font-size:15px}
#b-replay{background:#2a2d31;color:#fff}
#b-next{background:#1d1f22;color:var(--hz);border:2px solid var(--hz)}
#title{position:fixed;z-index:9;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 6vw 9vh;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
#title.off{display:none}
#title .kick{font-size:12px;letter-spacing:.35em;color:var(--hz);font-weight:800}
#title h1{font-size:clamp(46px,11vw,110px);font-weight:900;line-height:1;letter-spacing:.04em;text-shadow:0 4px 0 #000,0 0 40px rgba(0,0,0,.6);margin:6px 0 4px}
#title .bar{width:min(520px,80vw);margin:6px 0 14px}
#title p{font-size:clamp(14px,3.6vw,18px);line-height:1.6;text-shadow:0 2px 4px #000;max-width:560px}
#title .how{font-size:12px;opacity:.8;margin-top:8px}
#b-start{margin-top:18px;align-self:flex-start;min-height:58px;padding:0 34px;border-radius:30px;background:radial-gradient(circle at 50% 35%,#ff6a4d,#c81f17 60%,#7c0e0a);border:3px solid var(--hz);font-size:20px;font-weight:900;letter-spacing:.1em;box-shadow:0 0 0 3px #111}
#best{font-size:12px;margin-top:10px;opacity:.75}
#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20;background:#111}
@media (max-aspect-ratio:1/1){
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:min(50vh,460px);border-radius:12px 12px 0 0}
  #tabs{padding:6px 8px 0;gap:5px}.lv{min-height:44px;font-size:14px}
  #planbox{margin:6px 8px 5px}
  #brushes{padding:0 8px;gap:5px}.br{min-height:44px;font-size:13px}
  #pfoot{padding:6px 8px 8px}#b-fire{min-height:52px;font-size:20px}#b-clear{min-height:48px}
  #job{min-width:0}
  .jin{padding:5px 10px 7px}#j-name{font-size:14px}
  #result{bottom:8px}
  #title{padding:0 7vw 12vh}
  #b-start{align-self:stretch}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="job" class="card"><div class="stripe"></div><div class="jin">
  <div class="jt"><span id="j-no" class="num">現場 01</span><b id="j-name"></b></div>
  <div id="j-spec"></div><div id="j-cond"></div>
  <div id="j-money">所持金 <b id="m-val" class="num"></b></div>
</div></div>
<button id="b-snd" aria-label="音を切りかえる">🔊</button>
<div id="panel" class="card">
  <div class="stripe"></div>
  <div id="tabs"></div>
  <div id="planbox"><canvas id="plan"></canvas><div id="pl-hint"></div></div>
  <div id="brushes">
    <button class="br on" data-d="0"><i></i><span>1番<small>すぐ</small></span></button>
    <button class="br" data-d="1"><i></i><span>2番<small>0.5秒後</small></span></button>
    <button class="br" data-d="2"><i></i><span>3番<small>1秒後</small></span></button>
  </div>
  <div id="pfoot">
    <button id="b-clear">全部<br>はずす</button>
    <button id="b-fire" class="dim">発破<small id="f-info">爆薬 0本</small></button>
  </div>
</div>
<div id="count"></div>
<div id="toast"></div>
<button id="b-fast">早送り ▶▶</button>
<div id="result" class="card"><div class="stripe"></div><div class="rin">
  <div id="r-title"></div>
  <div id="r-stamp" class="stamp">成功</div>
  <div id="r-stars"></div>
  <div id="r-lines"></div>
  <div id="r-hint"></div>
  <div class="rbtn"><button id="b-replay">スローで見直す</button><button id="b-next">次の現場へ ▶</button></div>
</div></div>
<div id="title">
  <div class="kick">DEMOLITION ・ 発破解体</div>
  <h1>ビル爆破解体</h1>
  <div class="bar stripe"></div>
  <p>古いビルの柱に爆薬を仕掛けて、3・2・1。<br>隣の建物を壊さず、空き地へ崩し落とせ。</p>
  <div class="how">操作: 図面の柱をタップ(クリック)で爆薬 ・ 1番→2番→3番の順に爆発 ・ ドラッグで見回す<br>キー: 1 2 3 で順番 ・ 矢印と Space で仕掛ける ・ L で階 ・ Enter で発破</div>
  <button id="b-start">現場へ向かう</button>
  <div id="best"></div>
</div>
<div id="nogl">このゲームには WebGL2 が必要です。別のブラウザでお試しください。</div>
<script>
'use strict';
// ============================================================================
//  ビル爆破解体 — 柱に爆薬を仕掛け、時間差で倒れる向きを操って、空き地へ崩す
// ============================================================================
const $ = (id) => document.getElementById(id);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const SAVE_KEY = 'bill-bakuha-v1';
let save = { sound: true, best: 0, bestMoney: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { /* 保存なし */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 保存できない */ } }

// ---------- 乱数・数学 ----------
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mulS = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = (a) => Math.hypot(a[0], a[1], a[2]);
const nrm = (a) => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
function ident() { const m = new Float64Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; }
function trans(x, y, z) { const m = ident(); m[12] = x; m[13] = y; m[14] = z; return m; }
function mmul(a, b) {
  const o = new Float64Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  return o;
}
const tp = (m, p) => [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13], m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14]];
const tv = (m, v) => [m[0] * v[0] + m[4] * v[1] + m[8] * v[2], m[1] * v[0] + m[5] * v[1] + m[9] * v[2], m[2] * v[0] + m[6] * v[1] + m[10] * v[2]];
function rotAxis(a, ang) {
  const [x, y, z] = a, c = Math.cos(ang), s = Math.sin(ang), t = 1 - c, m = ident();
  m[0] = t * x * x + c; m[1] = t * x * y + s * z; m[2] = t * x * z - s * y;
  m[4] = t * x * y - s * z; m[5] = t * y * y + c; m[6] = t * y * z + s * x;
  m[8] = t * x * z + s * y; m[9] = t * y * z - s * x; m[10] = t * z * z + c;
  return m;
}
function invRigid(m) {
  const o = ident();
  o[0] = m[0]; o[1] = m[4]; o[2] = m[8]; o[4] = m[1]; o[5] = m[5]; o[6] = m[9]; o[8] = m[2]; o[9] = m[6]; o[10] = m[10];
  o[12] = -(o[0] * m[12] + o[4] * m[13] + o[8] * m[14]);
  o[13] = -(o[1] * m[12] + o[5] * m[13] + o[9] * m[14]);
  o[14] = -(o[2] * m[12] + o[6] * m[13] + o[10] * m[14]);
  return o;
}
function m3ToQuat(u, v, w) { // 正規直交の列ベクトル → 四元数 [x,y,z,w]
  const m00 = u[0], m10 = u[1], m20 = u[2], m01 = v[0], m11 = v[1], m21 = v[2], m02 = w[0], m12 = w[1], m22 = w[2];
  const tr = m00 + m11 + m22;
  let q;
  if (tr > 0) { const s = Math.sqrt(tr + 1) * 2; q = [(m21 - m12) / s, (m02 - m20) / s, (m10 - m01) / s, 0.25 * s]; }
  else if (m00 > m11 && m00 > m22) { const s = Math.sqrt(1 + m00 - m11 - m22) * 2; q = [0.25 * s, (m01 + m10) / s, (m02 + m20) / s, (m21 - m12) / s]; }
  else if (m11 > m22) { const s = Math.sqrt(1 + m11 - m00 - m22) * 2; q = [(m01 + m10) / s, 0.25 * s, (m12 + m21) / s, (m02 - m20) / s]; }
  else { const s = Math.sqrt(1 + m22 - m00 - m11) * 2; q = [(m02 + m20) / s, (m12 + m21) / s, 0.25 * s, (m10 - m01) / s]; }
  const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  return [q[0] / l, q[1] / l, q[2] / l, q[3] / l];
}
function quatAxes(q) { // 四元数 → 回転行列の3列
  const [x, y, z, w] = q;
  return [
    [1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w)],
    [2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w)],
    [2 * (x * z + y * w), 2 * (y * z - x * w), 1 - 2 * (x * x + y * y)],
  ];
}
const fmtMan = (v) => {
  const s = v < 0 ? '−' : '';
  v = Math.abs(Math.round(v));
  if (v >= 10000) { const o = v / 10000; return `${s}${o >= 10 ? o.toFixed(0) : o.toFixed(1).replace(/\.0$/, '')}億円`; }
  return `${s}${v.toLocaleString('ja-JP')}万円`;
};

// ---------- 音 ----------
let AC = null, master = null, sfxBus = null, noiseBuf = null, rumG = null;
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* 対応していないブラウザ */ }
  try {
    if (!AC) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
      master = AC.createGain(); master.gain.value = save.sound ? 0.9 : 0; master.connect(AC.destination);
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.25; comp.connect(master);
      sfxBus = AC.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(comp);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // 地鳴り: 低い音だけを、崩れている間だけ強弱をつけて鳴らす
      rumG = AC.createGain(); rumG.gain.value = 0; rumG.connect(comp);
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 95; lp.Q.value = 0.6; lp.connect(rumG);
      const ns = AC.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true; ns.connect(lp); ns.start();
      for (const f of [37, 44]) { const o = AC.createOscillator(); o.frequency.value = f; const g = AC.createGain(); g.gain.value = 0.25; o.connect(g); g.connect(rumG); o.start(); }
    }
    if (AC.state === 'suspended') AC.resume();
    const b = AC.createBuffer(1, 1, 22050), src = AC.createBufferSource();
    src.buffer = b; src.connect(AC.destination); src.start(0);
  } catch (e) { /* 音が出せなくても遊べる */ }
}
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, unlockAudio, { capture: true, passive: true });
const canPlay = () => AC && save.sound && AC.state === 'running';
function tone(f0, f1, dur, type, vol, delay = 0, attack = 0.005) {
  if (!canPlay()) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  if (best) { G.cursor = best.ci; sTick(); }
}
addEventListener('keydown', (e) => {
  const k = e.key;
  if (G.state === 'title') { if (k === 'Enter' || k === ' ') { e.preventDefault(); startRun(); } return; }
  if (G.state === 'plan') {
    if (k === '1' || k === '2' || k === '3') { G.brush = +k - 1; sTick(); updateHUD(); }
    else if (k.startsWith('Arrow')) { e.preventDefault(); G.kbd = true; moveCursor(k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0, k === 'ArrowUp' ? -1 : k === 'ArrowDown' ? 1 : 0); }
    else if (k === ' ') { e.preventDefault(); if (!G.kbd) { G.kbd = true; return; } togglePlace(G.cursor); }
    else if (k === 'l' || k === 'L' || k === 'PageUp' || k === 'Tab') { e.preventDefault(); G.level = (G.level + 1) % job.levels.length; sTick(); updateHUD(); }
    else if (k === 'PageDown') { G.level = (G.level + job.levels.length - 1) % job.levels.length; sTick(); updateHUD(); }
    else if (k === 'Enter') fire();
  } else if (G.state === 'result' || G.state === 'over') {
    if (k === 'Enter' || k === 'n' || k === 'N') nextJob();
    else if ((k === 'r' || k === 'R') && G.state === 'result') replay();
  } else if (G.state === 'blast' && (k === 'f' || k === 'F')) { G.fast = !G.fast; setUI(); }
  if (k === 'q' || k === 'Q') { cam.g.yaw += 0.3; cam.userT = performance.now(); }
  if (k === 'e' || k === 'E') { cam.g.yaw -= 0.3; cam.userT = performance.now(); }
});
// ---------- 毎コマ ----------
function update(dt, now) {
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 1.6);
  if (G.state === 'count') {
    G.cdT -= dt;
    const n = Math.ceil(G.cdT);
    if (n !== G.lastCd && n > 0) { G.lastCd = n; const el = $('count'); el.textContent = n; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); sHorn(n === 1); }
    if (G.cdT <= 0) {
      beginBlast(G.seed);
      G.state = 'blast'; G.acc = 0; G.slow = 1;
      setUI();
      const el = $('count'); el.textContent = '発破!'; el.classList.add('on'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      setTimeout(() => { if (G.state !== 'count') el.classList.remove('on'); }, 800);
    }
  }
  const simLike = G.state === 'blast' || G.state === 'replay' || G.state === 'settle';
  if (simLike && S) {
    const sp = (window.__simSpeed || 1) * G.slow * (G.fast ? 3 : 1);
    G.acc += dt * sp;
    let n = 0;
    const maxN = Math.max(5, Math.ceil(sp * 3));
    while (G.acc >= DT && n < maxN) { simStep(); G.acc -= DT; n++; }
    if (n >= maxN) G.acc = 0;
    if ((G.state === 'blast' || G.state === 'replay') && S.done) { G.state = 'settle'; G.setT = 0; setUI(); }
    if (G.state === 'settle') { G.setT += dt * Math.max(1, sp); if (G.setT > 2.4) finishBlast(); }
    setRumble(clamp(S.act * 0.5, 0, 1));
    S.flashT = Math.max(0, S.flashT - dt);
  } else setRumble(0);
  stepVisual(dt * (G.state === 'replay' ? G.slow : 1) * (window.__simSpeed && simLike ? Math.min(window.__simSpeed, 4) : 1));
  updateCam(dt, now);
  // 図面が画面を覆うぶん、ビルの映る位置をずらす
  let tsx = 0, tsy = 0;
  if (G.state === 'plan') {
    const rc = $('panel').getBoundingClientRect();
    if (rc.width && rc.height) { if (rc.top > innerHeight * 0.3) tsy = -(innerHeight - rc.top) / innerHeight; else tsx = rc.width / innerWidth; }
  }
  cam.sx += (tsx - cam.sx) * Math.min(1, dt * 5); cam.sy += (tsy - cam.sy) * Math.min(1, dt * 5);
  // 自動で画質を調整する(重いときは解像度・影・光のにじみを落とす)
  Q.acc += dt; Q.n++;
  if (Q.acc > 0.5) {
    const fps = Q.n / Q.acc;
    if (fps < 40 && Q.level > 0) { Q.level--; Q.good = 0; }
    else if (fps > 56) { Q.good += Q.acc; if (Q.good > 3 && Q.level < Q_TOP) { Q.level++; Q.good = 0; } }
    else Q.good = 0;
    Q.acc = 0; Q.n = 0;
  }
}
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  if (!job) return;
  update(dt, now);
  if (GL_OK) render();
  if (G.state === 'plan') drawPlan();
  updateLabels();
}
// ---------- テスト用の窓口(読み取り専用) ----------
window.gameTest = {
  state: () => G.state,
  score: () => G.money,
  webgl: () => HAS_GL,
  quality: () => Q.level,
  job: () => (job ? { idx: job.idx, type: job.type, floors: job.F, height: job.H, levels: job.levels.slice(), R: job.R, cols: B.cols.length } : null),
  level: () => G.level,
  planColumns: () => { const rc = planCv.getBoundingClientRect(); return planColumns().map((p) => ({ ci: p.ci, x: rc.left + p.x, y: rc.top + p.y, d: p.d })); },
  columns3D: () => { const st = job.levels[G.level]; return B.cols.map((cl, ci) => { const p = project([cl.x, st * B.hs + B.hs / 2, cl.z]); return p ? { ci, x: p[0], y: p[1] } : null; }); },
  charges: () => charges.length,
  building: () => ({ maxH: currentMaxHeight(), H: job.H, segs: segs.filter((s) => !s.gone && s.hi >= s.lo).length }),
  debris: () => DB.length,
  dust: () => dust.length,
  blastTime: () => (S ? S.t : 0),
  result: () => (G.res ? { head: G.res.head, complete: G.res.complete, stars: G.res.stars, delta: G.res.delta, maxH: G.res.maxH } : null),
};
// ---------- はじまり ----------
RUN_SEED = (Math.random() * 1e9) >>> 0;
try {
  if (!HAS_GL) throw new Error('WebGL2 なし');
  initGL();
  GL_OK = true;
} catch (e) {
  console.warn(e);
  $('nogl').style.display = 'flex';
}
newJob();
cam.yaw = cam.g.yaw; cam.dist = cam.g.dist * 1.08; cam.ty = cam.g.ty; cam.pitch = cam.g.pitch;
setUI();
requestAnimationFrame(frame);
</script>
