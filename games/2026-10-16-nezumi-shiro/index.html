<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ネズミ1万匹で城攻め</title>
<style>
:root { --bone: #efe6d2; --ink: #07080d; --blood: #d0262c; --ember: #ffa04a; --moon: #a9bde8; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; color: var(--bone);
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.min { font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ---- 遊んでいる間の表示: 左上に骨色の大きな数、右上に警鐘の輪 ---- */
#hud { position: fixed; inset: 0; pointer-events: none; display: none; }
#cnt { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); line-height: 1; }
#cnt .n { display: inline-block; font-size: clamp(42px, 10vw, 76px); font-weight: 900; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums; text-shadow: 0 0 24px rgba(0,0,0,.95), 0 3px 0 #000; transform-origin: 0 70%; }
#cnt .n.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { 0% { transform: scale(1.28); color: #fff3c4; } 100% { transform: scale(1); } }
#cnt .u { font-size: clamp(18px, 4vw, 26px); font-weight: 700; margin-left: 4px; opacity: .9; text-shadow: 0 2px 8px #000; }
#cnt .sub { font-size: 13px; margin-top: 6px; letter-spacing: .12em; opacity: .78; text-shadow: 0 1px 4px #000; }
#cnt .sub b { color: var(--ember); font-weight: 700; }
#bell { position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top));
  width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--c, #c9a45a) calc(var(--p, 0) * 1turn), rgba(255,255,255,.08) 0);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 4px 18px rgba(0,0,0,.6); }
#bell::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: rgba(8,9,14,.88); }
#bell span { position: relative; font-size: 12px; text-align: center; line-height: 1.15; letter-spacing: .06em; }
#bell span b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
#bell.ring { --c: var(--blood); animation: shake .25s infinite; }
#bell.done { --c: var(--blood); }
@keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
#snd { position: absolute; right: max(12px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 76px);
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(239,230,210,.35); background: rgba(8,9,14,.6);
  pointer-events: auto; font-size: 18px; }
#split { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
  width: 88px; height: 88px; border-radius: 50%; border: 2px solid rgba(239,230,210,.75); background: rgba(10,10,16,.62);
  pointer-events: auto; display: grid; place-items: center; line-height: 1.1; box-shadow: 0 6px 22px rgba(0,0,0,.6); }
#split b { font-size: 19px; letter-spacing: .1em; }
#split small { display: block; font-size: 10px; opacity: .6; letter-spacing: .1em; }
#split.on { border-color: var(--ember); color: #ffd9ad; box-shadow: 0 0 22px rgba(255,140,40,.45); }
#split:active { transform: scale(.94); }
#hint { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: min(78vw, 520px); text-align: center; font-size: 14px; line-height: 1.6; letter-spacing: .06em;
  text-shadow: 0 1px 6px #000, 0 0 14px #000; opacity: 0; transition: opacity .6s; }
#hint.show { opacity: .95; }
#toast { position: absolute; left: 50%; top: 22%; transform: translate(-50%, 0); white-space: nowrap; font-size: clamp(17px, 4.6vw, 26px);
  font-weight: 800; letter-spacing: .08em; text-shadow: 0 0 16px #000, 0 2px 0 #000; opacity: 0; transition: opacity .35s, transform .35s; }
#toast.show { opacity: 1; transform: translate(-50%, -8px); }
#toast.red { color: #ff6a5e; }
#toast.gold { color: #ffd27a; }
#flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,60,40,0) 40%, rgba(255,40,30,.35)); opacity: 0; transition: opacity .5s; }

/* ---- タイトル: 縦に積んだ大きな題、朱の一本線 ---- */
.ov { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: flex-end; align-items: flex-start;
  padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(34px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(4,5,9,.0) 25%, rgba(4,5,9,.55) 55%, rgba(4,5,9,.92)); }
.ov.show { display: flex; }
#title h1 { font-weight: 900; line-height: .98; letter-spacing: .02em; text-shadow: 0 4px 30px rgba(0,0,0,.9); }
#title h1 .a { display: block; font-size: clamp(26px, 6.5vw, 40px); letter-spacing: .25em; opacity: .9; }
#title h1 .b { display: block; font-size: clamp(64px, 17vw, 132px); letter-spacing: -.02em; }
#title h1 .b em { font-style: normal; color: var(--blood); }
#title h1 .c { display: block; font-size: clamp(40px, 10vw, 76px); letter-spacing: .12em; }
#title .rule { width: 120px; height: 4px; background: var(--blood); margin: 18px 0 16px; }
#title ul { list-style: none; font-size: 15px; line-height: 1.85; letter-spacing: .04em; opacity: .92; margin-bottom: 20px; }
#title ul li::before { content: "― "; color: var(--ember); }
#title .best { font-size: 13px; opacity: .7; margin-bottom: 14px; letter-spacing: .1em; }
.btn { min-height: 56px; padding: 0 30px 0 26px; border: 0; border-left: 6px solid var(--blood); background: var(--bone); color: #120c0a;
  font-size: 19px; font-weight: 800; letter-spacing: .12em; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
.btn:active { transform: translateY(2px); }

/* ---- 結果: 中央の大きな一字二字 ---- */
#result { justify-content: center; align-items: center; text-align: center; background: radial-gradient(ellipse at center, rgba(4,5,9,.55), rgba(4,5,9,.9)); }
#r-head { font-size: clamp(84px, 24vw, 170px); font-weight: 900; line-height: 1; letter-spacing: .1em; text-shadow: 0 6px 40px rgba(0,0,0,.9); }
#r-head.win { color: var(--blood); }
#r-sub { font-size: 16px; letter-spacing: .1em; margin: 10px 0 22px; opacity: .9; }
#r-grid { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 14px 30px; margin-bottom: 18px; text-align: left; }
#r-grid div { border-top: 1px solid rgba(239,230,210,.25); padding-top: 6px; font-size: 12px; letter-spacing: .1em; opacity: .9; }
#r-grid div b { display: block; font-size: 26px; font-weight: 900; letter-spacing: 0; font-variant-numeric: tabular-nums; }
#r-grid div b.rec { color: #ffd27a; }
#r-hint { max-width: 520px; font-size: 14px; line-height: 1.7; margin-bottom: 22px; color: #ffcf9e; padding: 0 8px; }
#nogl { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 30px; line-height: 1.8; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="flash"></div>
<div id="hud">
  <div id="cnt"><span class="n" id="n">12</span><span class="u">匹</span><div class="sub" id="zone">下水道</div></div>
  <div id="bell"><span>警鐘<b id="bell-t">3:00</b></span></div>
  <button id="snd" aria-label="音">♪</button>
  <button id="split"><span><b id="split-t">分ける</b><small>Space</small></span></button>
  <div id="hint"></div>
  <div id="toast"></div>
</div>
<div id="title" class="ov">
  <h1 class="min"><span class="a">ネズミ</span><span class="b">1<em>万</em>匹</span><span class="c">で城攻め</span></h1>
  <div class="rule"></div>
  <ul>
    <li>ドラッグ(指・マウス)した所へ、群れが走る</li>
    <li>食べ物を食べた分だけ、子ネズミが生まれる</li>
    <li>大群で兵士を飲み込み、城の大広間を埋めつくせ</li>
    <li>分ける(Space)で半分をおとりに残す。キーなら矢印 / WASD</li>
  </ul>
  <div class="best" id="t-best"></div>
  <button class="btn" id="b-start">下水道から出る ▶</button>
</div>
<div id="result" class="ov">
  <div id="r-head" class="min">落城</div>
  <div id="r-sub"></div>
  <div id="r-grid"></div>
  <div id="r-hint"></div>
  <button class="btn" id="b-again">もう一度、下水道から</button>
</div>
<div id="nogl">この端末では 3D(WebGL2)が使えないため、遊べません。<br>別のブラウザでお試しください。</div>
<script>
'use strict';
// ============================================================================
//  ネズミ1万匹で城攻め
//  12匹のネズミを食べて増やし、夜の城を飲み込む。ひと続きの長い旅(下水道 → 大広間)。
//  ネズミは 0.5m の格子の「流れの向き」と「混み具合」で動く。敵の攻撃は格子に書く危険度と、範囲で何匹かの要求。
// ============================================================================
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// ---------- 保存 ----------
const SAVE_KEY = 'nezumi-shiro-v1';
const save = { best: 0, wins: 0, sound: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { /* なし */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* なし */ } }

// ---------- 音 ----------
let AC = null, master = null, sfx = null, noiseBuf = null, windG = null, rumbleG = null;
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* 対応していないブラウザ */ }
  try {
    if (!AC) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
      master = AC.createGain(); master.gain.value = save.sound ? 0.9 : 0; master.connect(AC.destination);
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2; comp.connect(master);
      sfx = AC.createGain(); sfx.gain.value = 0.9; sfx.connect(comp);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // 夜風: 低い音だけを小さく、ゆっくり強弱をつける
      windG = AC.createGain(); windG.gain.value = 0; windG.connect(comp);
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 170; lp.Q.value = 0.5; lp.connect(windG);
      const ns = AC.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true; ns.connect(lp); ns.start();
      // 大群の地鳴り(数に応じて): 低いうなり
      rumbleG = AC.createGain(); rumbleG.gain.value = 0; rumbleG.connect(comp);
      const lp2 = AC.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 110; lp2.connect(rumbleG);
      const ns2 = AC.createBufferSource(); ns2.buffer = noiseBuf; ns2.loop = true; ns2.loopStart = 0.5; ns2.connect(lp2); ns2.start(0, 0.7);
    }
    if (AC.state === 'suspended') AC.resume();
    const b = AC.createBuffer(1, 1, 22050), src = AC.createBufferSource();
    src.buffer = b; src.connect(AC.destination); src.start(0);
  } catch (e) { /* 音が出せなくても遊べる */ }
}
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, unlockAudio, { capture: true, passive: true });
const canPlay = () => AC && save.sound && AC.state === 'running';
function envG(t, a, peak, dur) {
  const g = AC.createGain();
  peak = Math.max(0.0002, peak || 0);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + Math.max(0.002, a));
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(a + 0.01, dur));
  return g;
}
function tone(f0, f1, dur, type, vol, delay = 0, attack = 0.005, dest = null) {
  if (!canPlay() || !(f0 > 0) || !(dur > 0)) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 || f0), t + dur);
  const g = envG(t, attack, vol, dur);
  o.connect(g); g.connect(dest || sfx); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, ftype, f, q, vol, delay = 0, f1 = 0, attack = 0.003) {
  if (!canPlay() || !(dur > 0)) return;
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = ftype; fl.frequency.setValueAtTime(Math.max(30, f), t); fl.Q.value = q;
  if (f1 > 0) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = envG(t, attack, vol, dur);
  s.connect(fl); fl.connect(g); g.connect(sfx); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
const SND = {
  patter(v) { noise(rnd(0.012, 0.03), 'bandpass', rnd(2600, 5200), 2.2, v); },
  squeak(v) { const f = rnd(2700, 4600); tone(f, f * rnd(1.08, 1.45), rnd(0.05, 0.11), 'sine', v); tone(f * 1.5, f * 1.15, 0.05, 'triangle', v * 0.35, 0.025); },
  crunch(v) { noise(rnd(0.03, 0.06), 'bandpass', rnd(900, 2000), 3, v); },
  shriek() { const f = rnd(3600, 5200); tone(f, f * 0.6, 0.18, 'sawtooth', 0.025); tone(f * 1.2, f * 0.8, 0.14, 'sine', 0.05, 0.02); },
  bell() {
    if (!canPlay()) return;
    const f0 = 392;
    [[1, 0.16, 2.6], [2.0, 0.09, 1.8], [2.76, 0.08, 1.4], [4.07, 0.05, 1.0], [5.4, 0.035, 0.7], [0.5, 0.1, 2.8]].forEach(([k, v, d]) => tone(f0 * k, f0 * k * 0.998, d, 'sine', v, 0, 0.002));
    noise(0.05, 'highpass', 3000, 0.7, 0.12);
  },
  scream(kind) {
    const base = kind === 'villager' ? 420 : kind === 'archer' ? 330 : 260;
    if (!canPlay()) return;
    const t = AC.currentTime;
    const o = AC.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(base * 1.25, t); o.frequency.linearRampToValueAtTime(base * 1.4, t + 0.12); o.frequency.exponentialRampToValueAtTime(base * 0.45, t + 0.85);
    const vib = AC.createOscillator(); vib.frequency.value = 7; const vg = AC.createGain(); vg.gain.value = base * 0.04; vib.connect(vg); vg.connect(o.frequency);
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 2.5;
    const g = envG(t, 0.03, 0.2, 0.9);
    o.connect(bp); bp.connect(g); g.connect(sfx); o.start(t); o.stop(t + 1); vib.start(t); vib.stop(t + 1);
    noise(0.5, 'bandpass', 1300, 1.2, 0.05, 0.05);
  },
  cat() { tone(520, 940, 0.16, 'sawtooth', 0.035); tone(940, 360, 0.42, 'sawtooth', 0.04, 0.15); tone(1880, 700, 0.4, 'sine', 0.02, 0.15); },
  whoosh() { noise(0.26, 'bandpass', 500, 1.1, 0.1, 0, 1700, 0.04); },
  arrow() { noise(0.2, 'highpass', 2600, 0.7, 0.035, 0, 0, 0.05); tone(2100, 1100, 0.2, 'sine', 0.012); },
  thunk() { tone(190, 70, 0.12, 'triangle', 0.12); noise(0.05, 'bandpass', 900, 2, 0.06); },
  fire(v) { noise(rnd(0.006, 0.02), 'highpass', rnd(1500, 3500), 0.7, v); },
  ignite() { noise(0.8, 'lowpass', 300, 0.7, 0.3, 0, 3200, 0.06); tone(80, 38, 0.6, 'sine', 0.3); },
  overwhelm() { noise(0.35, 'bandpass', 1100, 0.9, 0.16); tone(130, 48, 0.35, 'sine', 0.28); for (let i = 0; i < 4; i++) SND.squeak(0.05); },
  splash(v) { noise(0.12, 'bandpass', 1400, 1.2, v); },
  creak() { tone(140, 95, 0.5, 'sawtooth', 0.03); noise(0.4, 'bandpass', 400, 4, 0.05); },
  milestone(k) { const base = [523, 587, 659, 784, 880, 1046][Math.min(5, k)]; tone(base, base, 0.5, 'triangle', 0.08); tone(base * 1.5, base * 1.5, 0.6, 'sine', 0.05, 0.08); tone(base * 2, base * 2, 0.7, 'sine', 0.04, 0.16); },
  victory() {
    SND.bell(); setTimeout(() => SND.bell(), 380);
    noise(2.6, 'lowpass', 140, 0.7, 0.45, 0, 60, 0.05); tone(65, 32, 2.4, 'sine', 0.4);
    [261, 329, 392, 523].forEach((f, i) => tone(f, f, 2.2, 'triangle', 0.06, 0.5 + i * 0.08, 0.02));
  },
  lose() { tone(220, 110, 1.4, 'triangle', 0.1); tone(165, 82, 1.6, 'sine', 0.08, 0.2); },
  click() { tone(900, 700, 0.05, 'square', 0.03); },
  split() { noise(0.18, 'bandpass', 2400, 1.5, 0.06, 0, 900); tone(700, 1200, 0.12, 'triangle', 0.05); },
};

// ---------- 世界の格子(0.5m) ----------
const X0 = -30, Z0 = -6, CS = 0.5, GX = 120, GZ = 924;
const WALL_Z = 380, WALL_T = 4, WALL_H = 10;
const HALL = { x0: -11, x1: 11, z0: 412, z1: 452 };
const ZONES = [[-99, '下水道'], [50, '村の路地'], [150, '穀物倉の通り'], [232, '城下町'], [345, '城壁の前'], [WALL_Z + WALL_T, '中庭'], [412, '大広間']];
const zoneName = (z) => { let n = ZONES[0][1]; for (const [z0, s] of ZONES) if (z >= z0) n = s; return n; };
const grid = new Uint8Array(GX * GZ);   // 0 通れる / 1 建物(自動で建てる) / 2 水 / 3 城壁(登る) / 5 建物(別に描く)
const fireG = new Uint8Array(GX * GZ);
const foodG = new Int16Array(GX * GZ);
const dens = new Uint16Array(GX * GZ);
const hazard = new Float32Array(GX * GZ), hazCause = new Uint8Array(GX * GZ), hazList = [];
const killMark = new Uint8Array(GX * GZ), killList = [];
const cellOf = (x, z) => { const ix = Math.floor((x - X0) / CS), iz = Math.floor((z - Z0) / CS); return ix < 0 || iz < 0 || ix >= GX || iz >= GZ ? -1 : iz * GX + ix; };
const cellX = (c) => X0 + ((c % GX) + 0.5) * CS, cellZ = (c) => Z0 + (((c / GX) | 0) + 0.5) * CS;
const isSolid = (t) => t === 1 || t === 5 || t === 6;
const solidAt = (x, z) => { const c = cellOf(x, z); return c < 0 || isSolid(grid[c]); };
function rectCells(x0, z0, x1, z1, fn) {
  const a = Math.max(0, Math.round((x0 - X0) / CS)), b = Math.min(GX, Math.round((x1 - X0) / CS));
  const c = Math.max(0, Math.round((z0 - Z0) / CS)), d = Math.min(GZ, Math.round((z1 - Z0) / CS));
  for (let iz = c; iz < d; iz++) for (let ix = a; ix < b; ix++) fn(iz * GX + ix);
}
function sumDens(x, z, r) { // 半径 r の中のネズミの数(格子で数える)
  let s = 0; const r2 = r * r;
  rectCells(Math.floor((x - r) * 2) / 2, Math.floor((z - r) * 2) / 2, Math.ceil((x + r) * 2) / 2, Math.ceil((z + r) * 2) / 2, (c) => {
    const dx = cellX(c) - x, dz = cellZ(c) - z; if (dx * dx + dz * dz <= r2) s += dens[c];
  });
  return s;
}

// ---------- 世界を作る(遊ぶたびに家並み・道・敵・食べ物が変わる) ----------
let floors = [], foods = [], enemies = [], lamps = [], fires = [], oils = [], decor = [];
const world = { granSide: 1, townSide: 1 };
function floor(x0, z0, x1, z1, mat, type = 0) { floors.push({ x0, z0, x1, z1, mat, y: floors.length * 0.0006 }); rectCells(x0, z0, x1, z1, (c) => { grid[c] = type; }); }

function emit(kind, x, y, z, vx, vy, vz, life, size, r, g, b) {
  if (PN >= MP) return;

    else put(pa.x[i], pa.y[i], pa.z[i], pa.s[i], pa.r[i] * t, pa.g[i] * t, pa.b[i] * t, 1);
  }
  for (let j = 0; j < glowArr.length; j += 8) put(glowArr[j], glowArr[j + 1], glowArr[j + 2], glowArr[j + 3], glowArr[j + 4], glowArr[j + 5], glowArr[j + 6], 1);
  return [nAlpha, n];
}
function render(dt) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), sc = Q.scale[Q.level];
  const W = Math.max(2, Math.round(innerWidth * dpr * sc)), H = Math.max(2, Math.round(innerHeight * dpr * sc));
  if (cv.width !== W || cv.height !== H || !FB) { cv.width = W; cv.height = H; makeTargets(W, H); }
  const aspect = innerWidth / Math.max(1, innerHeight);
  const fovY = aspect < 1.2 ? Math.min(80 * Math.PI / 180, 2 * Math.atan(Math.tan(28 * Math.PI / 180) / aspect)) : 48 * Math.PI / 180;
  persp(Pm, fovY, aspect, 0.25, 700);
  const sh = G.shake * G.shake * 0.6;
  const eye = [cam.e[0] + rnd(-sh, sh), cam.e[1] + rnd(-sh, sh), cam.e[2]];
  lookAt(Vm, eye, cam.c); mul(VP, Pm, Vm); invert(IVP, VP);
  const PS = H * Pm[5] * 0.5;
  collectLights();
  buildScene(dt);
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.s.fb); gl.viewport(0, 0, W, H);
  gl.clearColor(0.03, 0.042, 0.075, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
  // 手前にあることが多いものから描く(奥の重い石畳や壁を、隠れた所で塗らずにすむ)
  const LT = Q.lite[Q.level];
  const nr = fillRats(Q.ratStep[Q.level]);
  const lod = Q.lod[Q.level];
  if (nr) {
    gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
    if (LT) {
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ratTex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 1024, Math.ceil(nr * 2 / 1024), gl.RGBA, gl.FLOAT, ratInst, 0);
      gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, ratGeoTex[lod]);
      gl.useProgram(P.ratP.p); setCommon(P.ratP); gl.uniform1i(P.ratP.u.uInst, 2); gl.uniform1i(P.ratP.u.uGeo, 3); gl.uniform1i(P.ratP.u.uNV, ratCounts[lod]);
      gl.bindVertexArray(VAO.full); gl.drawArrays(gl.TRIANGLES, 0, ratCounts[lod] * nr);
      gl.activeTexture(gl.TEXTURE0);
    } else {
      gl.bindBuffer(gl.ARRAY_BUFFER, ratBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, ratInst, 0, nr * 8);
      gl.useProgram(P.rat.p); setCommon(P.rat);
      gl.bindVertexArray(VAO.rat[lod]); gl.drawArraysInstanced(gl.TRIANGLES, 0, ratCounts[lod], nr);
    }
    gl.disable(gl.CULL_FACE);
  }
  const pi = LT ? P.instL : P.inst; gl.useProgram(pi.p); setCommon(pi);
  for (const k in PRIMS) {
    const b = PRIMS[k]; if (!b.n) continue;
    gl.bindVertexArray(b.vao); gl.bindBuffer(gl.ARRAY_BUFFER, b.ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, b.data, 0, b.n * 12);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, b.count, b.n);
  }
  const pw = LT ? P.worldL : P.world; gl.useProgram(pw.p); setCommon(pw); gl.bindVertexArray(VAO.world); drawStatic();
  gl.depthMask(false);
  gl.useProgram(P.sky.p); setCommon(P.sky); gl.uniformMatrix4fv(P.sky.u.uInv, false, IVP); gl.bindVertexArray(VAO.full); gl.drawArrays(gl.TRIANGLES, 0, 3);
  const [nA, nAll] = fillParticles();
  gl.enable(gl.BLEND);
  if (nAll) {
    gl.bindBuffer(gl.ARRAY_BUFFER, partBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, partData, 0, nAll * 8);
    gl.useProgram(P.part.p); gl.uniformMatrix4fv(P.part.u.uVP, false, VP); gl.uniform1f(P.part.u.uPS, PS); gl.uniform3fv(P.part.u.uCam, cam.e); gl.uniform1f(P.part.u.uFogD, 0.0085);
    gl.bindVertexArray(VAO.part);
    if (nA) { gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.drawArrays(gl.POINTS, 0, nA); }
  }
  gl.blendFunc(gl.ONE, gl.ONE);
  if (nr) {
    const pe = LT ? P.eyeP : P.eye, u = pe.u, ne = Math.ceil(nr * Q.eyes[Q.level]);
    gl.useProgram(pe.p);
    gl.uniformMatrix4fv(u.uVP, false, VP); gl.uniform3fv(u.uCam, cam.e); gl.uniform1f(u.uPS, PS); gl.uniform1i(u.uNL, nLights); gl.uniform4fv(u.uLP, LP); gl.uniform3fv(u.uLC, LC); gl.uniform1f(u.uFogD, 0.0085);
    if (LT) { gl.uniform1i(u.uInst, 2); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ratTex); gl.activeTexture(gl.TEXTURE0); gl.bindVertexArray(VAO.full); gl.drawArrays(gl.POINTS, 0, ne * 2); }
    else { gl.bindVertexArray(VAO.eye); gl.drawArraysInstanced(gl.POINTS, 0, 2, ne); }
  }
  if (nAll > nA) { gl.useProgram(P.part.p); gl.bindVertexArray(VAO.part); gl.drawArrays(gl.POINTS, nA, nAll - nA); }
  gl.disable(gl.BLEND); gl.depthMask(true); gl.disable(gl.DEPTH_TEST);
  // 光のにじみ(ブルーム)
  const bloom = Q.bloom[Q.level];
  gl.bindVertexArray(VAO.full);
  if (bloom) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.a.fb); gl.viewport(0, 0, FB.a.w, FB.a.h);
    gl.useProgram(P.bright.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.s.tex); gl.uniform1i(P.bright.u.uT, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.useProgram(P.blur.p); gl.uniform1i(P.blur.u.uT, 0);
    for (let k = 0; k < 2; k++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, FB.b.fb); gl.bindTexture(gl.TEXTURE_2D, FB.a.tex); gl.uniform2f(P.blur.u.uDir, (1 + k) / FB.a.w, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, FB.a.fb); gl.bindTexture(gl.TEXTURE_2D, FB.b.tex); gl.uniform2f(P.blur.u.uDir, 0, (1 + k) / FB.a.h); gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.useProgram(P.comp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.s.tex); gl.uniform1i(P.comp.u.uS, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, FB.a.tex); gl.uniform1i(P.comp.u.uB, 1);
  gl.uniform1f(P.comp.u.uBloom, bloom ? 0.85 : 0); gl.uniform1f(P.comp.u.uExp, HDRok ? 1.3 : 1.1); gl.uniform1f(P.comp.u.uTime, G.t);
  gl.uniform3f(P.comp.u.uTint, G.hurt * 0.1, G.hurt * 0.006, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
}

// ---------- 進める ----------
function update(dt) {
  G.t += dt;
  clearMarks();
  stepEnemies(dt);
  stepArrows(dt);
  stepOils(dt);
  stepRats(dt);
  stepFoods(dt);
  stepParticles(dt);
  stepGame(dt);
  G.hurt = Math.max(0, G.hurt - dt * 0.8);
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  qualityTick(dt);
  fxBudget = 14;
  steer();
  let sim = dt * (window.__simSpeed || 1);
  while (sim > 1e-5) { const h = Math.min(sim, 1 / 20); update(h); sim -= h; }
  updateCam(dt);
  soundTick(dt);
  if (G.state === 'play' || G.state === 'win' || G.state === 'lose') updateHUD(false);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('hint').classList.remove('show'); }
  render(dt);
}

// ---------- テスト用の窓口(読み取り専用) ----------
window.gameTest = {
  state: () => G.state, score: () => Math.round(G.maxN), count: () => N, maxCount: () => Math.round(G.maxN),
  webgl: () => !!gl, quality: () => Q.level, zone: () => zoneName(G.lastZ), time: () => G.time,
  center: (g = 0) => ({ x: gc[g].x, z: gc[g].z, n: gc[g].n }), target: (g = 0) => ({ x: T[g].x, z: T[g].z }),
  foods: () => foods.map((f) => ({ x: f.x, z: f.z, amt: Math.round(f.amt), kind: f.kind })),
  enemies: () => enemies.map((e) => ({ type: e.type, x: e.x, z: e.z, dead: e.dead, gone: !!e.gone })),
  kills: () => G.kills, deaths: () => ({ ...G.deaths }), alarm: () => ({ time: G.time, at: ALARM_AT, phase: G.alarm }),
  split: () => G.split, climbing: () => G.climbN, hall: () => G.hallN, side: () => ({ granary: world.granSide, town: world.townSide }),
  particles: () => PN, lights: () => nLights,
  screenOf: (x, z, y = 0) => {
    const v = [x, y, z, 1], o = [0, 0, 0, 0];
    for (let i = 0; i < 4; i++) o[i] = VP[i] * v[0] + VP[4 + i] * v[1] + VP[8 + i] * v[2] + VP[12 + i] * v[3];
    return { x: (o[0] / o[3] + 1) / 2 * innerWidth, y: (1 - o[1] / o[3]) / 2 * innerHeight, front: o[3] > 0 };
  },
};

if (!gl) { $('nogl').style.display = 'grid'; }
else {
  initGL();
  titleScene();
  $('title').classList.add('show');
  $('t-best').textContent = save.best > 0 ? `これまでの最多: ${fmt(save.best)}匹` : '';
  requestAnimationFrame(frame);
}
</script>
