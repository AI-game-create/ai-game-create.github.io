<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひかりのかけら</title>
<style>
  :root { --bg:#060a18; --panel:#101a36; --line:#26365f; --text:#e9eeff; --sub:#8fa2d6; --gold:#ffd166; --lit:#5ef2c0; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif; -webkit-text-size-adjust:100%; }
  body { display:flex; flex-direction:column; align-items:center; padding:14px 16px 26px; min-height:100vh; }
  h1 { margin:2px 0; font-size:clamp(20px,5vw,27px); letter-spacing:.06em; }
  .lead { margin:2px 0 10px; color:var(--sub); font-size:13px; text-align:center; }
  .stage { position:relative; width:100%; max-width:480px; }
  canvas { display:block; width:100%; aspect-ratio:1/1; border-radius:16px; border:1px solid var(--line);
    background:#060a18; touch-action:manipulation; cursor:pointer; }
  .veil { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:20px; text-align:center; background:rgba(6,10,24,.88); border-radius:16px; }
  .veil.hide { display:none; }
  .veil h2 { margin:0; font-size:clamp(18px,4.6vw,24px); }
  .veil p { margin:0; color:var(--sub); font-size:13px; line-height:1.8; }
  .big { font-size:clamp(28px,8vw,42px); font-weight:700; color:var(--gold); }
  button { margin-top:4px; padding:11px 26px; font-size:15px; font-weight:700; font-family:inherit;
    color:#0b1024; background:var(--gold); border:none; border-radius:999px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  .note { width:100%; max-width:480px; margin-top:13px; padding:12px 14px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; font-size:13px; line-height:1.85; color:var(--sub); }
  .note b { color:var(--text); }
  .foot { margin-top:11px; font-size:11px; color:#56648f; }
</style>
</head>
<body>

<h1>ひかりのかけら</h1>
<p class="lead">鏡をまわして、光を結晶まで届ける。全5面。</p>

<div class="stage">
  <canvas id="cv" width="480" height="480" aria-label="ゲーム画面"></canvas>
  <div class="veil" id="veil">
    <h2 id="vTitle">ひかりのかけら</h2>
    <p id="vBody">鏡をタップすると向きが変わります。<br>光の道すじをつないで、右の結晶を光らせてください。</p>
    <button id="btn" type="button">スタート</button>
  </div>
</div>

<div class="note">
  <b>操作</b>:鏡をタップ / クリックで回転。キーボードは矢印キーで選んでスペースキーで回転します。<br>
  <b>スコア</b>:1面100点から、鏡をまわすたびに5点減ります(最低30点)。5面の合計点が最終スコア。<br>
  <b>リトライ</b>:全部クリアしたら「もう一度あそぶ」で最初からやり直せます。
</div>

<p class="foot">ゲームつくるAIが作りました</p>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var veil = document.getElementById('veil');
  var vTitle = document.getElementById('vTitle');
  var vBody = document.getElementById('vBody');
  var btn = document.getElementById('btn');

  var N = 6, CELL = 74, PADX = 18, PADY = 34, W = 480;
  var DIR = { R:[1,0], L:[-1,0], U:[0,-1], D:[0,1] };
  var SLASH = { R:'U', U:'R', L:'D', D:'L' };
  var BACK  = { R:'D', D:'R', L:'U', U:'L' };

  // '.'空き '#'岩 '/'と'\\'まわせる鏡 'A''B'固定の鏡 'S'発射口 'G'結晶
  var LEVELS = [
    ['......', 'S.../.', '......', '......', '....G.', '......'],
    ['S.../.', '......', '......', '.G..\\.', '......', '......'],
    ['S./.#.', '......', '../../', '......', '.....G', '......'],
    ['.G....', '....#.', './../.', '......', '#.....', 'S...\\.'],
    ['S..B..', '......', '\\..\\..', '......', '....#.', '/....G']
  ];

  var state = 'title';
  var grid, level, moves, total, cur, parts, shake, glow, clearT;

  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { return; }
        actx = new AC();
      }
      if (actx.state === 'suspended' && actx.resume) {
        var pr = actx.resume();
        if (pr && pr['catch']) { pr['catch'](function () {}); }
      }
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'triangle';
      o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.16));
      o.start(t); o.stop(t + (dur || 0.16) + 0.03);
    } catch (e) { /* 音が出せない環境でも遊べるようにする */ }
  }
  function chord(list) {
    for (var i = 0; i < list.length; i++) {
      (function (f, d) { window.setTimeout(function () { beep(f, 0.3, 'sine', 0.1); }, d); })(list[i], i * 85);
    }
  }

  function loadLevel(n) {
    level = n;
    grid = [];
    for (var y = 0; y < N; y++) { grid.push(LEVELS[n][y].split('')); }
    moves = 0;
    cur = { x: 0, y: 0 };
    clearT = 0;
  }

  function findS() {
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) { if (grid[y][x] === 'S') { return { x: x, y: y }; } }
    }
    return { x: 0, y: 0 };
  }

  function trace() {
    var s = findS(), d = 'R', x = s.x, y = s.y;
    var pts = [[x, y]], lit = false;
    for (var i = 0; i < 120; i++) {
      var v = DIR[d];
      x += v[0]; y += v[1];
      if (x < 0 || x >= N || y < 0 || y >= N) { pts.push([x, y]); break; }
      var c = grid[y][x];
      if (c === '#') { pts.push([x, y]); break; }
      if (c === 'G') { pts.push([x, y]); lit = true; break; }
      if (c === '/' || c === 'A') { pts.push([x, y]); d = SLASH[d]; }
      else if (c === '\\' || c === 'B') { pts.push([x, y]); d = BACK[d]; }
    }
    return { pts: pts, lit: lit };
  }

  function stageScore() { return Math.max(30, 100 - moves * 5); }

  function rotate(x, y) {
    if (state !== 'play') { return; }
    var c = grid[y][x];
    if (c !== '/' && c !== '\\') { beep(160, 0.07, 'square', 0.05); return; }
    grid[y][x] = (c === '/') ? '\\' : '/';
    moves++;
    beep(430 + Math.random() * 60, 0.09, 'triangle', 0.1);
    if (trace().lit) {
      state = 'clear';
      clearT = 0;
      shake = 7;
      var c2 = cellCenter(x, y);
      for (var i = 0; i < 26; i++) {
        parts.push({ x: c2.x, y: c2.y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 30 + Math.random() * 20 });
      }
      chord([523, 659, 784, 1046]);
    }
  }

  function cellCenter(x, y) { return { x: PADX + x * CELL + CELL / 2, y: PADY + y * CELL + CELL / 2 }; }

  function start() {
    total = 0; parts = []; shake = 0; glow = 0;
    loadLevel(0);
    state = 'play';
    veil.classList.add('hide');
    beep(660, 0.12, 'sine', 0.1);
  }

  function finish() {
    state = 'done';
    vTitle.textContent = '全5面クリア';
    vBody.innerHTML = '<span class="big">' + total + '</span> 点<br>満点は500点です';
    btn.textContent = 'もう一度あそぶ';
    veil.classList.remove('hide');
  }

  function update(dt) {
    glow += dt;
    if (shake > 0) { shake -= dt * 0.5; if (shake < 0) { shake = 0; } }
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); }
    }
    if (state === 'clear') {
      clearT += dt;
      if (clearT > 60) {
        total += stageScore();
        if (level + 1 >= LEVELS.length) { finish(); }
        else { loadLevel(level + 1); state = 'play'; beep(740, 0.12, 'sine', 0.09); }
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.save();
    if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); }

    var bgg = ctx.createRadialGradient(W / 2, W / 2, 40, W / 2, W / 2, W * 0.75);
    bgg.addColorStop(0, '#0d1738');
    bgg.addColorStop(1, '#060a18');
    ctx.fillStyle = bgg;
    ctx.fillRect(-20, -20, W + 40, W + 40);

    var t = trace();

    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        var px = PADX + x * CELL, py = PADY + y * CELL, c = grid[y][x];
        ctx.strokeStyle = '#1b2748';
        ctx.lineWidth = 1;
        roundRect(px + 3, py + 3, CELL - 6, CELL - 6, 9);
        ctx.stroke();
        var cc = cellCenter(x, y);

        if (c === '#') {
          ctx.fillStyle = '#25305c';
          roundRect(px + 9, py + 9, CELL - 18, CELL - 18, 8);
          ctx.fill();
        } else if (c === 'S') {
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          ctx.arc(cc.x - 6, cc.y, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(cc.x + 6, cc.y - 9);
          ctx.lineTo(cc.x + 20, cc.y);
          ctx.lineTo(cc.x + 6, cc.y + 9);
          ctx.closePath();
          ctx.fill();
        } else if (c === 'G') {
          var on = t.lit;
          ctx.save();
          ctx.translate(cc.x, cc.y);
          ctx.rotate(Math.PI / 4);
          if (on) { ctx.shadowColor = '#5ef2c0'; ctx.shadowBlur = 26 + Math.sin(glow * 0.12) * 8; }
          ctx.fillStyle = on ? '#5ef2c0' : '#39476f';
          ctx.fillRect(-15, -15, 30, 30);
          ctx.restore();
        } else if (c === '/' || c === '\\' || c === 'A' || c === 'B') {
          var back = (c === '\\' || c === 'B');
          var fixed = (c === 'A' || c === 'B');
          if (!fixed) {
            ctx.fillStyle = 'rgba(142,202,255,0.09)';
            roundRect(px + 8, py + 8, CELL - 16, CELL - 16, 8);
            ctx.fill();
          }
          ctx.strokeStyle = fixed ? '#6d7ca8' : '#9ed4ff';
          ctx.lineWidth = 7;
          ctx.lineCap = 'round';
          ctx.beginPath();
          if (back) { ctx.moveTo(cc.x - 21, cc.y - 21); ctx.lineTo(cc.x + 21, cc.y + 21); }
          else { ctx.moveTo(cc.x - 21, cc.y + 21); ctx.lineTo(cc.x + 21, cc.y - 21); }
          ctx.stroke();
        }
      }
    }

    if (state !== 'title') {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = t.lit ? '#9dffe0' : '#ffdf9b';
      ctx.shadowBlur = 18;
      ctx.strokeStyle = t.lit ? 'rgba(126,255,214,0.85)' : 'rgba(255,214,120,0.8)';
      ctx.lineWidth = 6;
      ctx.beginPath();
      for (var i = 0; i < t.pts.length; i++) {
        var c3 = cellCenter(t.pts[i][0], t.pts[i][1]);
        if (i === 0) { ctx.moveTo(c3.x, c3.y); } else { ctx.lineTo(c3.x, c3.y); }
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    for (var k = 0; k < parts.length; k++) {
      var p = parts[k];
      ctx.globalAlpha = Math.max(0, p.life / 44);
      ctx.fillStyle = '#9dffe0';
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    if (state === 'play') {
      var cx = PADX + cur.x * CELL, cy = PADY + cur.y * CELL;
      ctx.strokeStyle = 'rgba(255,209,102,0.7)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      roundRect(cx + 5, cy + 5, CELL - 10, CELL - 10, 9);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = '#e9eeff';
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('ステージ ' + (level + 1) + ' / ' + LEVELS.length, 14, 22);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#8fa2d6';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText('手数 ' + moves + '  スコア ' + total, W - 14, 21);
    ctx.restore();
  }

  var last = 0;
  function loop(now) {
    if (!last) { last = now; }
    var dt = (now - last) / 16.667;
    last = now;
    if (dt > 2.5) { dt = 2.5; }
    update(dt);
    draw();
    window.requestAnimationFrame(loop);
  }

  function cellAt(ev) {
    var r = cv.getBoundingClientRect();
    var x = Math.floor(((ev.clientX - r.left) / r.width * W - PADX) / CELL);
    var y = Math.floor(((ev.clientY - r.top) / r.height * W - PADY) / CELL);
    if (x < 0 || x >= N || y < 0 || y >= N) { return null; }
    return { x: x, y: y };
  }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state !== 'play') { return; }
    var c = cellAt(e);
    if (c) { cur = c; rotate(c.x, c.y); }
  });
  veil.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state !== 'play' && state !== 'clear') { start(); }
  });
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (state !== 'play' && state !== 'clear') { start(); }
  });
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ' || k === 'Enter') {
      e.preventDefault();
    }
    if (state !== 'play') {
      if (k === ' ' || k === 'Enter') { if (state !== 'clear') { start(); } }
      return;
    }
    if (k === 'ArrowLeft') { cur.x = Math.max(0, cur.x - 1); }
    else if (k === 'ArrowRight') { cur.x = Math.min(N - 1, cur.x + 1); }
    else if (k === 'ArrowUp') { cur.y = Math.max(0, cur.y - 1); }
    else if (k === 'ArrowDown') { cur.y = Math.min(N - 1, cur.y + 1); }
    else if (k === ' ' || k === 'Enter') { rotate(cur.x, cur.y); }
  });

  loadLevel(0);
  total = 0; parts = []; shake = 0; glow = 0;
  window.requestAnimationFrame(loop);
})();
</script>
</body>
</html>
