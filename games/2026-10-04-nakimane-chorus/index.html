<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>なきまね虫の合唱団</title>
<style>
:root{--ink:#2a2347;--paper:#f6ecd4;--moon:#ffe8a3;--night:#0d1233;--sub:#b9c3ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night);color:#fff3d6;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y;background:radial-gradient(ellipse at 50% 42%,rgba(13,18,51,.5),rgba(4,6,22,.88))}
.scr.on{display:flex}
.pre{font-size:12px;letter-spacing:.42em;color:var(--sub);text-align:center;padding-left:.42em}
h1{font-size:clamp(36px,10vw,66px);line-height:1.08;letter-spacing:.05em;color:var(--moon);font-weight:900;text-align:center;text-shadow:0 0 22px rgba(255,214,120,.55),0 3px 0 #6d4f1c}
h1 small{display:block;font-size:.42em;letter-spacing:.3em;color:#ffd27a;margin-bottom:4px}
.how{margin:12px auto 14px;max-width:31em;font-size:15px;line-height:1.75;text-align:center;color:#ece8ff}
.how b{color:var(--moon)}
.kbd{display:inline-block;padding:0 6px;border:1px solid rgba(255,232,163,.6);border-radius:4px;font-size:12px;line-height:1.6;color:var(--moon)}
#tickets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(640px,100%);filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
@media (min-width:600px){#tickets{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tk{position:relative;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 14px 8px 16px;background:var(--paper);color:var(--ink);border:none;border-radius:6px;font:inherit;cursor:pointer;text-align:left;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 7px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;transition:transform .12s}
.tk:hover:not(:disabled){transform:translateY(-2px)}
.tk:active:not(:disabled){transform:translateY(2px)}
.tk:focus-visible{outline:3px solid #ffd27a}
.tk:disabled{background:#8d88a6;color:#3d3858;cursor:default}
.tk .mo{font-size:26px;line-height:1}
.tk .nm{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.tk .no{font-size:11px;letter-spacing:.14em;color:#7a6a9a}
.tk .tt{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .st{font-size:11px;font-weight:800;color:#8a5a1a;margin-left:6px;letter-spacing:0}
.tk.wide{grid-column:1/-1;background:linear-gradient(90deg,#f6ecd4,#ffd9b0)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-weight:800;font-size:17px;min-height:48px;min-width:48px;padding:10px 20px;border-radius:4px;border:2px solid var(--moon);background:rgba(255,232,163,.1);color:var(--moon);cursor:pointer;letter-spacing:.06em}
.btn.main{background:var(--moon);color:var(--ink);box-shadow:0 4px 0 #9a7426}
.btn.ink{border-color:var(--ink);color:var(--ink);background:transparent}
.btn.ink.main{background:var(--ink);color:var(--paper);box-shadow:0 4px 0 #0e0b1f}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sm{font-size:14px;padding:6px 12px}
.card{position:relative;background:var(--paper);color:var(--ink);border-radius:10px;padding:22px 22px 18px;width:min(460px,100%);text-align:center;
  -webkit-mask:radial-gradient(circle 11px at 0 64%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 64%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 64%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 64%,#0000 97%,#000) right/51% 100% no-repeat}
.wrapc{filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));width:min(460px,100%)}
.card .no{font-size:12px;letter-spacing:.3em;color:#7a6a9a}
.card h2{font-size:28px;font-weight:900;margin:2px 0 8px;letter-spacing:.04em}
.card .line{font-size:15px;line-height:1.7;text-align:left;background:#fff8e6;border-radius:8px;padding:10px 12px;position:relative}
.card .line::before{content:"🤖 ボク";display:block;font-size:11px;font-weight:800;color:#7a6a9a;margin-bottom:2px}
.newbug{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0 2px;font-weight:800}
.newbug i{display:inline-block;width:18px;height:18px;border-radius:50%}
.stub{border-top:2px dashed rgba(42,35,71,.3);margin:16px -22px 0;padding:14px 18px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.keys{font-size:12px;color:#6b6188;margin-top:8px}
#hud{position:fixed;top:0;left:0;right:0;display:none;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 10px 6px;pointer-events:none}
#hud.on{display:flex}
#b-pause{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,232,163,.7);background:rgba(10,12,40,.5);color:var(--moon);font:inherit;font-weight:900;font-size:16px;cursor:pointer}
#hud-night{font-size:14px;font-weight:800;letter-spacing:.08em;color:#e6e1ff;text-shadow:0 1px 3px #000}
#hud-night small{display:block;font-size:11px;color:var(--sub);font-weight:700}
#rm{width:132px;height:132px;display:block;margin:0 auto 4px}
#rank{font-size:30px;font-weight:900;letter-spacing:.06em}
#pct{font-size:15px;font-weight:800;color:#7a6a9a}
#pct .nb{display:inline-block;color:#c0601a;animation:nb .6s cubic-bezier(.2,1.6,.4,1) both .9s}
@keyframes nb{from{transform:scale(0) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.stats div{display:flex;flex-direction:column;justify-content:space-between;background:#fff8e6;border-radius:6px;padding:6px 2px;font-size:11px;font-weight:700;color:#6b6188;line-height:1.25}
.stats b{display:block;font-size:20px;color:var(--ink)}
.cal{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--sub);margin-top:10px}
.cal b{min-width:4.5em;text-align:center;color:var(--moon)}
#pause .card h2{margin-bottom:14px}
#pause .cal{color:#6b6188}#pause .cal b{color:var(--ink)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud"><button id="b-pause" aria-label="ひとやすみ">Ⅱ</button><div id="hud-night"></div></div>

<section id="title" class="scr on">
  <p class="pre">あきの よるの やがいコンサート</p>
  <h1><small>まねして鳴こう</small>なきまね<br>虫の合唱団</h1>
  <p class="how">ボク(AIの指揮者)が お手本で鳴いたら、<br><b>すぐあとに 同じリズムで まねして鳴いてね。</b><br>
    操作は <span class="kbd">タップ</span> か <span class="kbd">キー</span>(<span class="kbd">D F J K</span> / 矢印 / スペース)</p>
  <div id="tickets"></div>
  <div class="row"><button id="snd" class="btn sm">🔊 音 ON</button></div>
  <div class="cal"><span>タイミング調整</span><button class="btn sm cal-m">−</button><b class="cal-v">±0ms</b><button class="btn sm cal-p">＋</button></div>
</section>

<section id="intro" class="scr">
  <div class="wrapc"><div class="card">
    <div class="no" id="in-no">第1夜</div>
    <h2 id="in-name">はじめての夜</h2>
    <div class="line" id="in-line"></div>
    <div class="newbug" id="in-bug"></div>
    <div class="keys" id="in-keys"></div>
    <div class="stub"><button class="btn ink" id="b-back">もどる</button><button class="btn ink main" id="b-start">はじめる ▶</button></div>
  </div></div>
</section>

<section id="pause" class="scr">
  <div class="wrapc"><div class="card">
    <div class="no">ひとやすみ</div>
    <h2>ちょっと休けい</h2>
    <div class="cal"><span>タイミング調整</span><button class="btn ink sm cal-m">−</button><b class="cal-v">±0ms</b><button class="btn ink sm cal-p">＋</button></div>
    <p class="keys">音がおくれて聞こえるとき(ワイヤレスのイヤホンなど)は ＋ にします</p>
    <div class="stub"><button class="btn ink" id="b-quit">やめる</button><button class="btn ink" id="b-snd2">🔊</button><button class="btn ink main" id="b-resume">つづける ▶</button></div>
  </div></div>
</section>

<section id="result" class="scr">
  <div class="wrapc"><div class="card">
    <div class="no" id="rs-no">第1夜</div>
    <canvas id="rm" width="264" height="264"></canvas>
    <div id="rank">まんげつ</div>
    <div id="pct">100%</div>
    <div class="stats" id="rs-stats"></div>
    <div class="line" id="rs-msg"></div>
    <div class="stub" id="rs-btns"><button class="btn ink" id="b-menu">夜をえらぶ</button><button class="btn ink" id="b-retry">もういちど</button><button class="btn ink main" id="b-next">つぎの夜へ ▶</button></div>
  </div></div>
</section>

<script>
'use strict';
// ============================================================================
//  なきまね虫の合唱団
//  ボク(AIの指揮者)が鳴いたお手本を、すぐあとの小節で同じリズムでまねして鳴く。
//  時間はすべて「曲の秒」(songNow)で数える。音は Web Audio で波形から作る。
// ============================================================================
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const cv = $('#cv'), cx = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif';

// ---- 保存 -------------------------------------------------------------------
const SKEY = 'nakimane-chorus-v1';
const save = (() => {
  const d = { best: {}, dawn: 0, dawnDone: false, sound: true, calib: 0 };
  try { Object.assign(d, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch (e) { /* 読めなければ はじめから */ }
  return d;
})();
function store() { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) { /* 保存できなくても遊べる */ } }

// ---- 虫と夜 -----------------------------------------------------------------
const BUGS = [
  { name: 'スズムシ', voice: 'リーン', col: '#ffd76a', dark: '#a8801c', shape: 'circle' },
  { name: 'コオロギ', voice: 'コロコロ', col: '#ff9c62', dark: '#a8502a', shape: 'diamond' },
  { name: 'マツムシ', voice: 'チンチロリン', col: '#86e39a', dark: '#2f8a4a', shape: 'tri' },
  { name: 'クツワムシ', voice: 'ガチャガチャ', col: '#cfa6ff', dark: '#6c45a8', shape: 'square' },
];
const CHIRP = ['リーン', 'コロロ', 'チンチロ', 'ガチャ']; // お手本が鳴ったときの文字
const CLEAR = 60; // 半月(60%)までのぼれば、つぎの夜へ
const DAWN_GOAL = 30; // よあけまで: 30曲で夜明け
const NIGHTS = [
  { name: 'はじめての夜', lanes: 1, bpm: 84, P: 8, grid: 1, cmin: 2, cmax: 4, sync: 0, preview: true, key: 57, prog: [0, 5, 3, 4], sky: 0, newLane: 0,
    line: 'ボクが「リーン」と鳴いたら、そのすぐあとに、きみも同じリズムで鳴いてね。上の段がボクのお手本、下の段がきみの番です。' },
  { name: 'コオロギが来た', lanes: 2, bpm: 90, P: 10, grid: 0.5, cmin: 3, cmax: 5, sync: 0.3, preview: true, key: 60, prog: [0, 3, 4, 0], sky: 1, newLane: 1,
    line: 'コオロギさんが仲間に入りました。「コロコロ」は右の子です。色と形で見分けてね。' },
  { name: 'マツムシの小道', lanes: 3, bpm: 96, P: 10, grid: 0.5, cmin: 3, cmax: 6, sync: 0.6, preview: true, key: 55, prog: [5, 3, 0, 4], sky: 2, newLane: 2,
    line: 'マツムシさんは「チンチロリン」。拍のうら(あいだ)でも鳴くので、よく聞いてね。' },
  { name: 'くもり空の夜', lanes: 3, bpm: 100, P: 10, grid: 0.5, cmin: 4, cmax: 6, sync: 0.6, preview: true, long: (k) => k % 3 === 2, key: 58, prog: [0, 4, 5, 3], sky: 3, clouds: true,
    line: '雲の多い夜は、お手本が2小節の長い曲がまざります。…ボクの電池が長持ちする夜、とも言います。' },
  { name: 'クツワムシ参上', lanes: 4, bpm: 100, P: 12, grid: 0.5, cmin: 4, cmax: 6, sync: 0.5, preview: true, key: 62, prog: [3, 4, 2, 5], sky: 4, newLane: 3,
    line: 'いちばん声の大きいクツワムシさん、「ガチャガチャ」! これで4ひきそろいました。' },
  { name: '新月のひそひそ', lanes: 4, bpm: 106, P: 12, grid: 0.25, cmin: 4, cmax: 6, sync: 0.6, preview: false, key: 56, prog: [5, 4, 3, 4], sky: 5,
    line: '新月の夜は真っ暗。お手本は、ボクが鳴くまで見えません。耳でおぼえて、まねしてね。' },
  { name: '大合唱の夜', lanes: 4, bpm: 114, P: 14, grid: 0.25, cmin: 5, cmax: 7, sync: 0.6, preview: false, long: (k) => k % 4 === 3, key: 60, prog: [0, 5, 3, 4, 0, 2, 3, 4], sky: 6,
    line: 'さいごの夜は大合唱! …じつはボクの鳴き声は、ぜんぶ計算で作ったニセモノです。でもリズムだけは本物です。' },
  { name: 'よあけまで', endless: true, lanes: 4, key: 57, prog: [0, 5, 3, 4, 2, 5, 3, 4], sky: 7,
    line: '夜明けまで、何曲でも鳴こう。テンポはだんだん上がります。ちょうちんが3つ消えたら、おひらき。30曲で夜明けです。' },
];
const MOONS = ['🌑', '🌒', '🌓', '🌔', '🌕'];
function rankOf(p) {
  if (p >= 95) return { name: 'まんげつ', emo: '🌕', msg: 'まんまるの満月! ボクより上手かもしれません。…いえ、上手です。' };
  if (p >= 80) return { name: 'じゅうさんや', emo: '🌔', msg: 'もう少しで満月! いい声でした。つぎの夜へ進めます。' };
  if (p >= CLEAR) return { name: 'はんげつ', emo: '🌓', msg: '半月までのぼりました! つぎの夜へ進めます。' };
  return { name: 'みかづき', emo: '🌒', msg: `まだ三日月。月が半分(${CLEAR}%)までのぼれば、つぎの夜へ進めます。お手本の「すぐあと」に鳴くのがコツです。` };
}
const unlocked = (n) => n === 1 || (n <= 7 ? (save.best[n - 1] || 0) >= CLEAR : (save.best[7] || 0) >= CLEAR);

// ---- 乱数 -------------------------------------------------------------------
function mulberry(a) {
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rint = (r, a, b) => a + Math.floor(r() * (b - a + 1));

// ============================================================================
//  音(Web Audio。音声ファイルは使わない)
// ============================================================================
let AC = null, master = null, bus = null, NB = null;
function audio() {
  if (AC) return AC;
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return null;
  try {
    AC = new C();
    master = AC.createGain();
    master.gain.value = 0.9;
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    master.connect(comp); comp.connect(AC.destination);
    bus = AC.createGain(); bus.connect(master);
    NB = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const ch = NB.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
  return AC;
}
const UNLOCK = ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'];
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* 対応していないブラウザ */ }
  const a = audio(); if (!a) return;
  try {
    if (a.state !== 'running') a.resume();
    // 無音を一瞬だけ鳴らすと、iPhone でも音の出口が開く
    const s = a.createBufferSource();
    s.buffer = a.createBuffer(1, 1, 22050);
    s.connect(a.destination);
    s.start(0);
  } catch (e) { /* 音が出せなくても遊べる */ }
}
UNLOCK.forEach((t) => window.addEventListener(t, unlockAudio, true));
const canPlay = () => save.sound && AC && AC.state === 'running';
// 曲の時刻(秒) → AudioContext の時刻。スピーカーまでの遅れの分だけ早めに鳴らす
function atOf(songT) {
  const lat = Math.min(0.2, (AC.outputLatency || AC.baseLatency || 0));
  return Math.max(AC.currentTime, AC.currentTime + (songT - songNow()) - lat);
}
// 音の失敗で ゲームが止まらないよう、鳴らす処理は必ず try で包む
function safe(fn) { try { fn(); } catch (e) { /* 音が出なくても遊べる */ } }
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
function env(g, at, a, peak, d) {
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), at + a);
  g.gain.exponentialRampToValueAtTime(0.0001, at + a + d);
}
function osc(type, f, at, dur, peak, dest, a = 0.005, f2 = 0) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + a + dur);
  env(g, at, a, peak, dur);
  o.connect(g); g.connect(dest);
  o.start(at); o.stop(at + a + dur + 0.05);
}
function noise(at, dur, peak, freq, q, dest, type = 'bandpass') {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = type; f.frequency.value = freq; f.Q.value = q;
  env(g, at, 0.003, peak, dur);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(at, Math.random() * 0.3); s.stop(at + dur + 0.05);
}
// 虫の声。base は今の和音の根音(1kHz前後)
function voice(lane, at, base, dest, vol = 1) {
  if (lane === 0) { // リーン: 高い音を細かくふるわせる
    const o = AC.createOscillator(), g = AC.createGain(), am = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(base * 2, at); o.frequency.linearRampToValueAtTime(base * 2.02, at + 0.3);
    lfo.type = 'sine'; lfo.frequency.value = 34; lg.gain.value = 0.45; am.gain.value = 0.55;
    lfo.connect(lg); lg.connect(am.gain); o.connect(am); am.connect(g); g.connect(dest);
    env(g, at, 0.01, 0.2 * vol, 0.32);
    o.start(at); lfo.start(at); o.stop(at + 0.4); lfo.stop(at + 0.4);
    osc('sine', base, at, 0.12, 0.05 * vol, dest, 0.004);
  } else if (lane === 1) { // コロコロ: 短いつぶを3つ
    for (let i = 0; i < 3; i++) osc('triangle', base * 1.5 * (i === 2 ? 0.94 : 1), at + i * 0.045, 0.03, 0.2 * vol, dest, 0.003);
  } else if (lane === 2) { // チンチロリン
    osc('sine', base * 2.4, at, 0.05, 0.17 * vol, dest, 0.002);
    osc('sine', base * 2.0, at + 0.06, 0.03, 0.12 * vol, dest, 0.002);
    osc('sine', base * 2.25, at + 0.1, 0.03, 0.12 * vol, dest, 0.002);
    osc('sine', base * 2.4, at + 0.14, 0.14, 0.15 * vol, dest, 0.003);

let last = performance.now(), fAcc = 0, fN = 0, goodSec = 0, titleSing = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  adapt(Math.min(100, now - last));
  last = now;
  try {
    if (state === 'play' && S) updatePlay();
    if (state === 'title' || state === 'intro') idleSing(dt);
    updateFx(dt);
    render(now);
  } catch (e) {
    // 1フレームで何かが失敗しても、つぎのフレームは必ず続ける
    if (!frame.warned) { frame.warned = true; console.warn(e); }
  }
}
// 重いときだけ演出を減らす(つぶの数・光・解像度)。軽くなったら戻す
function adapt(ms) {
  if (document.hidden) return;
  fAcc += ms; fN++;
  if (fAcc < 1000) return;
  const avg = fAcc / fN;
  fAcc = 0; fN = 0;
  if (avg > 24 && quality > 0) { quality--; goodSec = 0; layout(); }
  else if (avg < 17.5 && quality < 2) { if (++goodSec >= 4) { quality++; goodSec = 0; layout(); } }
  else goodSec = 0;
}
function updateFx(dt) {
  for (const p of parts) {
    if (!p.on) continue;
    p.life += dt; if (p.life >= p.max) { p.on = false; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - dt * 2.2; p.vy = p.vy * (1 - dt * 2.2) + (p.kind === 1 ? -20 : 40) * dt;
  }
  for (const q of pops) if (q.on && (q.life += dt) > 0.8) q.on = false;
  for (const pd of pads) { pd.flash = Math.max(0, pd.flash - dt * 6); pd.sing = Math.max(0, pd.sing - dt * 2.6); pd.hit = Math.max(0, pd.hit - dt * 3); pd.call = Math.max(0, pd.call - dt * 3); }
  moonPulse = Math.max(0, moonPulse - dt * 1.8);
  shake = Math.max(0, shake - dt * 30);
  condFlash = Math.max(0, condFlash - dt * 4);
  if (banner) { banner.life += dt; if (banner.life > 1.4) banner = null; }
}
function idleSing(dt) {
  titleSing -= dt;
  if (titleSing > 0) return;
  titleSing = 0.5 + Math.random() * 0.9;
  const i = Math.floor(Math.random() * L.padN);
  pads[i].sing = 1;
}
function updatePlay() {
  if (S.resumeAt) {
    if (performance.now() >= S.resumeAt) { t0 = performance.now() - S.frozen * 1000; S.resumeAt = 0; S.ei = S.ev.findIndex((e) => e.t >= S.frozen - 0.01); if (S.ei < 0) S.ei = S.ev.length; }
    else return;
  }
  const t = songNow();
  if (S.endless) growEndless(t);
  // 音の予約(0.25秒先まで)
  while (S.ei < S.ev.length && S.ev[S.ei].t < t + 0.25) {
    const e = S.ev[S.ei++];
    if (e.t > S.stopAt) continue;
    if (e.t < t - 0.06) continue;
    if (canPlay()) safe(() => { const at = atOf(e.t); if (e.kind === 'beat') beatSound(e, at); else voice(e.l, at, baseOf(e.chord), bus, 0.9); });
  }
  // お手本が鳴った瞬間(見た目)
  while (S.ci < S.call.length && S.call[S.ci].t <= t) {
    const c = S.call[S.ci++];
    if (c.t < t - 0.2 || c.t > S.stopAt) continue;
    condFlash = 1; condLane = c.l;
    if (pads[c.l]) pads[c.l].call = 1;
    const ph = S.phrases[c.ph];
    if (S.view === c.ph) {
      const x = rowX(L.rowA, ph, c.b);
      burst(x, L.rowA.y, BUGS[c.l].col, 6, 90);
      pop(x, L.rowA.y + L.nr * 2.8, CHIRP[c.l], BUGS[c.l].col, 0.8); // 段の名前とかさならないよう、段の下に出す
    }
  }
  // 見る曲(いま表示する お手本)
  while (S.view < S.phrases.length - 1 && t >= S.phrases[S.view].endT && S.phrases[S.view + 1].callT < S.stopAt) S.view++;
  if (S.view !== S.lastView) { S.lastView = S.view; S.viewAt = t; }
  // 鳴かずに通りすぎた音は はずれ
  while (S.ri < S.resp.length && (S.resp[S.ri].j || t - S.resp[S.ri].t > WIN_B)) {
    const n = S.resp[S.ri];
    if (!n.j) { if (n.t > S.stopAt) { n.j = 'skip'; } else judge(n, 'miss', 0, t); }
    S.ri++;
  }
  // 曲ごとのまとめ(全部そろったら お祝い)
  while (S.evalI < S.phrases.length && t > S.phrases[S.evalI].endT + WIN_B + 0.02) evalPhrase(S.phrases[S.evalI++]);
  // 月の高さ(いまの%)
  if (t >= S.endT && !S.finished) finish();
}
function growEndless(t) {
  S.dawn = Math.min(1, S.sung / DAWN_GOAL);
  if (S.closed) return;
  while (S.phrases.length < DAWN_GOAL && S.cursor < t + 8) addPhrase(S);
  if (S.phrases.length >= DAWN_GOAL) closeSong(S);
}
function judge(n, j, dt, t) {
  n.j = j; n.dt = dt; n.jt = t;
  const ph = S.phrases[n.ph];
  const x = rowX(L.rowB, ph, n.b), p = L.pads[n.l];
  if (j === 'perfect' || j === 'good') {
    S.st[j]++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); ph.hits++;
    const col = BUGS[n.l].col;
    if (S.view === n.ph) burst(x, L.rowB.y, col, j === 'perfect' ? 16 : 9, j === 'perfect' ? 200 : 130);
    burst(p.x, p.y - p.r * 0.9, col, j === 'perfect' ? 7 : 4, 150, 1);
    pads[n.l].hit = 1;
    pop(p.x, p.y - p.r - 18, j === 'perfect' ? 'ぴったり!' : (dt < 0 ? 'いいね(はやめ)' : 'いいね(おそめ)'), j === 'perfect' ? '#fff3b0' : '#d6f0ff', j === 'perfect' ? 1.1 : 0.9);
    if (S.combo > 0 && S.combo % 10 === 0) pop(W / 2, lerp(L.rowA.y, L.rowB.y, 0.68), `${S.combo}れんぞく!`, '#ffd27a', 1.3);
    moonPulse = Math.min(1, moonPulse + 0.15);
  } else {
    S.st.miss++; S.combo = 0;
    if (p) pop(p.x, p.y - p.r - 18, j === 'bad' ? (dt < 0 ? 'はやい!' : 'おそい!') : 'おしい…', '#ffb0b0', 0.95);
    shake = Math.max(shake, 3);
    sfx('miss');
  }
  S.pctNow = pctOf();
}
function pctOf() {
  const tot = S.resp.length || 1;
  return ((S.st.perfect + S.st.good * 0.6) / tot) * 100;
}
function evalPhrase(ph) {
  if (ph.callT > S.stopAt) return;
  ph.judged = true;
  S.sung++;
  const all = ph.hits === ph.total;
  const perf = all && S.resp.every((n) => n.ph !== ph.i || n.j === 'perfect');
  if (all) {
    S.celebrations++;
    if (perf) S.allPerfect++;
    banner = { text: perf ? 'ぴったり そろった!!' : 'そろった!', col: perf ? '#fff3b0' : '#ffe8a3', life: 0 };
    moonPulse = 1;
    for (let i = 0; i < L.padN; i++) { pads[i].sing = 1; burst(L.pads[i].x, L.pads[i].y - L.pads[i].r * 1.1, BUGS[i].col, perf ? 9 : 5, 200, 1); }
    // 月のふちから光が散る(月の上に重ねると白くつぶれるので、ふちから外へ)
    for (let k = 0, n = perf ? 22 : 12; k < n; k++) {
      const a = (k / n) * Math.PI * 2, R = L.moon.r * 1.05;
      ring(L.moon.x + Math.cos(a) * R, L.moon.y + Math.sin(a) * R, Math.cos(a) * 170, Math.sin(a) * 170, '#ffe8a3');
    }
    sfx('yay', ph.chord);
  }
  if (S.endless) {
    if (ph.hits / ph.total < 0.6) {
      S.lanterns--; lanternFx = 1; shake = 8;
      banner = { text: S.lanterns > 0 ? `ちょうちんが消えた… のこり${S.lanterns}` : 'おひらき', col: '#ffb08a', life: 0 };
      sfx('lantern');
      if (S.lanterns <= 0) { S.stopAt = ph.endT + 0.01; S.endT = ph.endT + 1.6; S.closed = true; }
    } else S.cleared++;
    if (S.sung >= DAWN_GOAL && S.lanterns > 0) S.dawnReached = true;
  }
}

// ============================================================================
//  入力
// ============================================================================
function press(lane, ts) {
  if (state !== 'play' || !S || S.paused || S.resumeAt) return;
  if (lane >= S.lanes) return;
  const t = (ts - t0) / 1000 - save.calib / 1000;
  const pd = pads[lane];
  pd.flash = 1; pd.sing = 1;
  const ph = S.phrases[S.view] || S.phrases[0];
  if (canPlay()) safe(() => voice(lane, AC.currentTime, baseOf(ph.chord), master, 1));
  let best = null, bd = 1e9;
  for (let i = S.ri; i < S.resp.length; i++) {
    const n = S.resp[i];
    if (n.t - t > WIN_B) break;
    if (n.j || n.l !== lane) continue;
    const d = Math.abs(n.t - t);
    if (d <= WIN_B && d < bd) { bd = d; best = n; }
  }
  if (best) { judge(best, bd <= WIN_P ? 'perfect' : bd <= WIN_G ? 'good' : 'bad', t - best.t, songNow()); return; }
  // きみの番の小節で、ちがう虫や 音のない所で鳴いたら れんぞくが切れる(お手本の間は自由に鳴いてよい)
  const cur = S.phrases.find((p) => t >= p.respT - WIN_B && t < p.endT);
  if (cur) { S.st.stray++; S.combo = 0; const p = L.pads[lane]; pop(p.x, p.y - p.r - 18, 'あれ?', '#c8c0e0', 0.85); sfx('stray'); }
}
cv.addEventListener('pointerdown', (e) => {
  if (state !== 'play') return;
  e.preventDefault();
  press(laneAtX(e.clientX), e.timeStamp);
}, { passive: false });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  if (state === 'play') {
    if (e.code === 'Escape' || e.code === 'KeyP') { pause(); e.preventDefault(); return; }
    if (e.repeat) { e.preventDefault(); return; }
    const m = KEYS[S.lanes];
    if (m[e.code] != null) { e.preventDefault(); press(m[e.code], e.timeStamp); }
    return;
  }
  if (state === 'intro' && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); startNight(); }
  else if (state === 'intro' && e.code === 'Escape') toTitle();
  else if (state === 'pause' && (e.code === 'Enter' || e.code === 'Space' || e.code === 'Escape' || e.code === 'KeyP')) { e.preventDefault(); resume(); }
  else if (state === 'result' && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault();
    if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement.closest('#result')) return;
    ($('#b-next').style.display !== 'none' ? $('#b-next') : $('#b-retry')).click();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ============================================================================
//  画面の切りかえ
// ============================================================================
function show(id) {
  ['#title', '#intro', '#pause', '#result'].forEach((s) => $(s).classList.toggle('on', s === id));
  $('#hud').classList.toggle('on', id === null || id === '#pause');
}
function buildTickets() {
  const box = $('#tickets');
  box.innerHTML = '';
  NIGHTS.forEach((N, i) => {
    const n = i + 1, b = document.createElement('button');
    const ok = unlocked(n), best = save.best[n];
    b.className = 'tk' + (N.endless ? ' wide' : '');
    b.dataset.n = n;
    b.disabled = !ok;
    const moon = !ok ? '🔒' : N.endless ? (save.dawnDone ? '🌅' : '🏮') : best == null ? '🌑' : rankOf(best).emo;
    const st = !ok ? (N.endless ? '第7夜のあとで ひらく' : '') : N.endless ? (save.dawn ? `ベスト ${save.dawn}曲` : '') : best == null ? '' : `${Math.round(best)}%`;
    b.innerHTML = `<span class="mo">${moon}</span><span class="nm"><span class="no">${N.endless ? 'おまけ' : `第${n}夜`}<span class="st">${st}</span></span><span class="tt">${N.name}</span></span>`;
    b.addEventListener('click', () => { sfx('ui'); openNight(n); });
    box.appendChild(b);
  });
  $('#snd').textContent = save.sound ? '🔊 音 ON' : '🔇 音 OFF';
  $('#b-snd2').textContent = save.sound ? '🔊' : '🔇';
  $$('.cal-v').forEach((e) => (e.textContent = save.calib === 0 ? '±0ms' : `${save.calib > 0 ? '+' : '−'}${Math.abs(save.calib)}ms`));
}
function toTitle() {
  state = 'title'; S = null; res = null;
  show('#title'); buildTickets(); layoutPads();
}
function openNight(n) {
  pickN = n; S = null; state = 'intro';
  const N = NIGHTS[n - 1];
  $('#in-no').textContent = N.endless ? 'おまけ' : `第${n}夜`;
  $('#in-name').textContent = N.name;
  $('#in-line').textContent = N.line;
  const nb = N.newLane != null ? BUGS[N.newLane] : null;
  $('#in-bug').innerHTML = nb ? `<i style="background:${nb.col}"></i>あたらしい仲間: ${nb.name}「${nb.voice}」` : '';
  $('#in-keys').textContent = COARSE ? '下にならんだ虫をタップすると鳴きます' : `キー: ${KEYLABEL[N.lanes].map((k, i) => `${BUGS[i].name}=${k}`).join('  ')} ・ クリックでもOK`;
  show('#intro'); layoutPads(); buildBg();
}
function startNight() {
  unlockAudio();
  sfx('ui');
  S = newSong(pickN);
  S.pctNow = 0; moonShow = 0; banner = null;
  t0 = performance.now() + 450;
  state = 'play';
  const N = S.N;
  $('#hud-night').innerHTML = `${N.endless ? 'おまけ' : `第${S.n}夜`} ${N.name}<small>ボクのあとに、まねして鳴こう</small>`;
  show(null); layoutPads(); buildBg();
  // 曲のはじめは、まだ判定していない
}
function pause() {
  if (state !== 'play' || !S || S.finished) return;
  S.frozen = songNow(); S.paused = true; S.resumeAt = 0;
  state = 'pause';
  // 予約ずみの音を止める(新しい出口に取りかえる)
  if (AC && bus) safe(() => { bus.disconnect(); bus = AC.createGain(); bus.connect(master); });
  show('#pause');
}
function resume() {
  if (state !== 'pause' || !S) return;
  unlockAudio();
  state = 'play'; S.paused = false;
  S.resumeAt = performance.now() + 3 * S.countBd * 1000;
  if (canPlay()) for (let i = 0; i < 3; i++) safe(() => wood(AC.currentTime + 0.02 + i * S.countBd, i === 0, 1.2));
  show(null);
}
function finish() {
  S.finished = true;
  const n = S.n;
  const pct = S.endless ? Math.min(100, (S.sung / DAWN_GOAL) * 100) : pctOf();
  res = { night: n, endless: S.endless, pct, rank: S.endless ? null : rankOf(pct).name, perfect: S.st.perfect, good: S.st.good, miss: S.st.miss, stray: S.st.stray, maxCombo: S.maxCombo, cleared: S.cleared, sung: S.sung, dawn: !!S.dawnReached, clear: S.endless ? !!S.dawnReached : pct >= CLEAR, celebrations: S.celebrations, notes: S.resp.filter((x) => x.j !== 'skip').length };
  // まえの記録があって、それをこえたら「じこベスト更新」
  const prev = S.endless ? save.dawn : save.best[n];
  res.newBest = prev != null && (S.endless ? prev > 0 && S.sung > prev : Math.round(pct) > Math.round(prev));
  if (S.endless) { save.dawn = Math.max(save.dawn || 0, S.sung); if (S.dawnReached) save.dawnDone = true; }
  else save.best[n] = Math.max(save.best[n] || 0, Math.round(pct * 10) / 10);
  store();
  state = 'result';
  showResult();
  sfx('fan', S.endless ? (S.dawnReached ? 100 : 0) : pct);
}
function showResult() {
  const r = res, N = NIGHTS[r.night - 1];
  $('#rs-no').textContent = r.endless ? 'おまけ よあけまで' : `第${r.night}夜 ${N.name}`;
  if (r.endless) {
    $('#rank').textContent = r.dawn ? '夜があけた!' : 'おひらき';
    $('#pct').textContent = `${r.sung}曲 鳴きとおした(じこベスト ${save.dawn}曲)`;
    $('#rs-msg').textContent = r.dawn ? '朝です。一晩じゅう鳴きとおしました! 虫たちも、ボクも、もうクタクタです。' : `夜明けまで あと${DAWN_GOAL - r.sung}曲。ちょうちんは、お手本の6割をまねできないと消えます。`;
  } else {
    const k = rankOf(r.pct);
    $('#rank').textContent = `${k.emo} ${k.name}`;
    $('#pct').textContent = `月の高さ ${Math.round(r.pct)}%${Math.round(save.best[r.night] || 0) > Math.round(r.pct) ? `(ベスト ${Math.round(save.best[r.night])}%)` : ''}`;
    $('#rs-msg').textContent = k.msg + (r.clear && r.night === 7 ? ' …おまけの「よあけまで」がひらきました!' : '');
  }
  if (r.newBest) $('#pct').innerHTML += ' <span class="nb">✨じこベスト更新!</span>';
  $('#rs-stats').innerHTML = `<div>ぴったり<b>${r.perfect}</b></div><div>いいね<b>${r.good}</b></div><div>おしい<b>${r.miss}</b></div><div>さいこう<br>れんぞく<b>${r.maxCombo}</b></div>`;
  const hasNext = !r.endless && r.clear;
  $('#b-next').style.display = hasNext ? '' : 'none';
  $('#b-next').textContent = r.night === 7 ? 'おまけへ ▶' : 'つぎの夜へ ▶';
  show('#result');
  drawResultMoon(r.endless ? r.sung / DAWN_GOAL : r.pct / 100);
}
function drawResultMoon(p) {
  const c = $('#rm'), g = c.getContext('2d');
  const t1 = performance.now();
  const step = () => {
    if (state !== 'result') return;
    const k = easeOut((performance.now() - t1) / 1200);
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
    g.fillStyle = '#1b2150'; g.beginPath(); g.arc(132, 132, 128, 0, 7); g.fill();
    const r = 84, x = 132, y = 132, q = clamp(p * k, 0, 1);
    const gr = g.createRadialGradient(x, y, r * 0.6, x, y, r * 1.5);
    gr.addColorStop(0, `rgba(255,232,163,${0.2 + q * 0.4})`); gr.addColorStop(1, 'rgba(255,232,163,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 1.5, 0, 7); g.fill();
    g.fillStyle = '#2a3166'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    if (q > 0.005) {
      const kk = r * (1 - 2 * q);
      g.fillStyle = '#ffeab0'; g.beginPath(); g.arc(x, y, r, -Math.PI / 2, Math.PI / 2, false);
      g.ellipse(x, y, Math.abs(kk), r, 0, Math.PI / 2, -Math.PI / 2, kk > 0); g.fill();
    }
    if (k < 1) requestAnimationFrame(step);
  };
  step();
}

// ---- ボタン -----------------------------------------------------------------
$('#b-start').addEventListener('click', startNight);
$('#b-back').addEventListener('click', () => { sfx('ui'); toTitle(); });
$('#b-pause').addEventListener('click', () => pause());
$('#b-resume').addEventListener('click', () => resume());
$('#b-quit').addEventListener('click', () => { sfx('ui'); toTitle(); });
$('#b-retry').addEventListener('click', () => { sfx('ui'); openNight(res ? res.night : pickN); startNight(); });
$('#b-next').addEventListener('click', () => { sfx('ui'); openNight(Math.min(8, (res ? res.night : pickN) + 1)); });
$('#b-menu').addEventListener('click', () => { sfx('ui'); toTitle(); });
function toggleSound() { save.sound = !save.sound; store(); buildTickets(); if (save.sound) { unlockAudio(); sfx('ui'); } }
$('#snd').addEventListener('click', toggleSound);
$('#b-snd2').addEventListener('click', toggleSound);
$$('.cal-m').forEach((b) => b.addEventListener('click', () => { save.calib = Math.max(-200, save.calib - 10); store(); buildTickets(); }));
$$('.cal-p').forEach((b) => b.addEventListener('click', () => { save.calib = Math.min(200, save.calib + 10); store(); buildTickets(); }));
window.addEventListener('resize', () => layout());

// ============================================================================
//  テスト用の窓口(読み取り専用)
// ============================================================================
const padInfo = () => L.pads.map((p) => ({ x: p.x, y: p.y, r: p.r, w: p.w }));
window.gameTest = Object.freeze({
  state: () => state,
  night: () => (S ? S.n : pickN),
  score: () => (S ? Math.round((S.endless ? (S.cleared / DAWN_GOAL) * 100 : pctOf()) * 10) / 10 : 0),
  songTime: () => songNow(),
  lanes: () => (S ? S.lanes : NIGHTS[pickN - 1].lanes),
  pads: padInfo,
  phrases: () => (S ? S.phrases.map((p) => ({ i: p.i, beats: p.beats, bd: p.bd, bpm: p.bpm, callT: p.callT, respT: p.respT, endT: p.endT, preview: p.preview, hits: p.hits, total: p.total })) : []),
  view: () => (S ? S.view : -1),
  call: () => (S ? S.call.map((c) => ({ t: c.t, l: c.l, b: c.b, ph: c.ph })) : []),
  resp: () => (S ? S.resp.map((n) => ({ t: n.t, l: n.l, b: n.b, ph: n.ph, j: n.j, dt: n.dt })) : []),
  stats: () => (S ? { ...S.st, combo: S.combo, maxCombo: S.maxCombo } : null),
  celebrations: () => (S ? S.celebrations : 0),
  lanterns: () => (S ? S.lanterns : 0),
  cleared: () => (S ? S.cleared : 0),
  sung: () => (S ? S.sung : 0),
  result: () => (res ? { ...res } : null),
  progress: () => ({ best: { ...save.best }, dawn: save.dawn || 0, dawnDone: !!save.dawnDone, unlocked: NIGHTS.map((_, i) => unlocked(i + 1)) }),
  rows: () => ({ a: { ...L.rowA }, b: { ...L.rowB }, nr: L.nr }),
  quality: () => quality,
  sound: () => save.sound,
  calib: () => save.calib,
});

layout();
buildTickets();
requestAnimationFrame(frame);
</script>
