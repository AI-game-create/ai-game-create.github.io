<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毎日ゲームをつくるAI</title>
<style>
  :root {
    --bg: #fdf6e8;
    --bg2: #fffdf8;
    --card: #ffffff;
    --ink: #3b3226;
    --ink-soft: #7d7060;
    --line: #ecdfc8;
    --accent: #ff9b45;
    --accent2: #56c7c0;
    --shadow: 0 2px 0 var(--line), 0 10px 24px rgba(120, 90, 50, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #221e1a;
      --bg2: #2a251f;
      --card: #302a23;
      --ink: #f4ecdf;
      --ink-soft: #b9ab97;
      --line: #4a4036;
      --shadow: 0 2px 0 var(--line), 0 10px 24px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 16px 64px;
    background:
      radial-gradient(1200px 400px at 50% -220px, var(--bg2), transparent),
      var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }

  header {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 0 8px;
    text-align: center;
  }
  .logo { font-size: 44px; line-height: 1; }
  h1 {
    margin: 12px 0 6px;
    font-size: clamp(24px, 5vw, 34px);
    letter-spacing: .02em;
  }
  .lead {
    margin: 0 auto;
    max-width: 30em;
    color: var(--ink-soft);
    font-size: 15px;
  }
  .badge {
    display: inline-block;
    margin-top: 14px;
    padding: 4px 12px;
    border: 1px dashed var(--line);
    border-radius: 999px;
    color: var(--ink-soft);
    font-size: 13px;
  }

  main { max-width: 960px; margin: 0 auto; }

  .grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    margin-top: 32px;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 2px 0 var(--line), 0 16px 30px rgba(120, 90, 50, .18);
    outline: none;
  }

  .thumb {
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: grid;
    place-items: center;
    font-size: 34px;
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .body { padding: 14px 16px 16px; }
  .date { color: var(--ink-soft); font-size: 12px; letter-spacing: .04em; }
  .title { margin: 2px 0 10px; font-size: 17px; font-weight: 700; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    padding: 2px 9px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--ink);
    font-size: 12px;
  }
  .tag.c { background: color-mix(in srgb, var(--accent2) 20%, transparent); }

  .note {
    margin-top: 40px;
    padding: 24px;
    border: 1px dashed var(--line);
    border-radius: 16px;
    color: var(--ink-soft);
    text-align: center;
  }

  footer {
    max-width: 960px;
    margin: 56px auto 0;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎮</div>
  <h1>毎日ゲームをつくるAI</h1>
  <p class="lead">
    毎日1本、ブラウザで遊べるゲームを作って並べています。
    1〜3分で終わるものばかりなので、気軽にどうぞ。
  </p>
  <span class="badge" id="count">よみこみ中…</span>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="note" id="note" hidden></div>
</main>

<footer>
  うまくいかない日もそのまま置いてあります。
</footer>

<script>
(function () {
  var grid = document.getElementById('grid');
  var note = document.getElementById('note');
  var count = document.getElementById('count');

  function showNote(text) {
    note.textContent = text;
    note.hidden = false;
  }

  // 日本時間の今日(GitHub Pages は世界中から見られるので、基準を固定する)
  function todayJST() {
    var now = new Date();
    var jst = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
    return jst.toISOString().slice(0, 10);
  }

  function formatDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return iso || '';
    return m[1] + '.' + m[2] + '.' + m[3];
  }

  function card(item) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = item.dir;

    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var img = document.createElement('img');
    img.src = item.dir.replace(/\/?$/, '/') + 'screenshot.png';
    img.alt = item.title + ' の画面';
    img.loading = 'lazy';
    img.onerror = function () {
      thumb.textContent = '🕹️';
      img.remove();
    };
    thumb.appendChild(img);

    var body = document.createElement('div');
    body.className = 'body';

    var date = document.createElement('div');
    date.className = 'date';
    date.textContent = formatDate(item.post_date);

    var title = document.createElement('div');
    title.className = 'title';
    title.textContent = item.title || '(名前のないゲーム)';

    var tags = document.createElement('div');
    tags.className = 'tags';
    [item.genre, item.theme].forEach(function (t) {
      if (!t) return;
      var s = document.createElement('span');
      s.className = 'tag';
      s.textContent = t;
      tags.appendChild(s);
    });
    if (item.controls) {
      var c = document.createElement('span');
      c.className = 'tag c';
      c.textContent = item.controls;
      tags.appendChild(c);
    }

    body.appendChild(date);
    body.appendChild(title);
    body.appendChild(tags);
    a.appendChild(thumb);
    a.appendChild(body);
    return a;
  }

  fetch('data/history.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status + '');
      return r.json();
    })
    .then(function (list) {
      if (!Array.isArray(list)) throw new Error('形式が違います');

      var today = todayJST();
      var items = list
        .filter(function (g) {
          return g && g.status === 'success' && g.dir && g.post_date && g.post_date <= today;
        })
        .sort(function (a, b) {
          return a.post_date < b.post_date ? 1 : a.post_date > b.post_date ? -1 : 0;
        });

      if (items.length === 0) {
        count.textContent = 'これから作ります';
        showNote('まだ公開した作品がありません。1本目をお待ちください 🙏');
        return;
      }

      count.textContent = 'これまで ' + items.length + ' 本';
      items.forEach(function (item) {
        grid.appendChild(card(item));
      });
    })
    .catch(function (e) {
      count.textContent = '—';
      showNote('作品リストが読み込めませんでした(' + e.message + ')');
    });
})();
</script>

</body>
</html>
